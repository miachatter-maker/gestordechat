<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
:root{
  --bg:#FFFFFF;--bg-soft:#FBF6F7;--line:#F0E2E5;--line-strong:#E5CFD5;
  --text:#241A1D;--text2:#7A6A6E;--text3:#B5A1A6;
  --accent:#E8779B;--accent-soft:#FCEAF0;--accent-strong:#D85C84;
  --ok:#177350;--ok-soft:#E7F5EE;--warn:#9A5B00;--warn-soft:#FBF0DD;
  --bad:#B42334;--bad-soft:#FBEAEA;
  --r-sm:8px;--r-md:10px;--r-lg:14px;
  --font:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
/* A pedido da gestora: dificulta um tester copiar a resposta do outro (o
   link é o mesmo pra todos, só troca o nome no seletor). Não é à prova de
   tudo (quem sabe usar o devtools do navegador sempre consegue contornar),
   mas bloqueia cópia por mouse/teclado no uso normal. */
*{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
input,textarea{-webkit-user-select:text;user-select:text;} /* precisa selecionar o próprio texto pra editar/corrigir enquanto digita */
html,body{background:var(--bg-soft);}
body{font-family:var(--font);color:var(--text);min-height:100dvh;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;padding:18px 14px 60px;}
.wrap{max-width:620px;margin:0 auto;}
.header{text-align:center;margin-bottom:16px;padding-top:8px;}
.header .eyebrow{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-strong);margin-bottom:4px;}
.header h1{font-size:20px;font-weight:800;}
.header .sub{font-size:12.5px;color:var(--text3);margin-top:4px;}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;margin-bottom:12px;}
.field{margin-bottom:12px;}
.flabel{display:block;font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.03em;margin-bottom:6px;}
.finput,.ftext,.fselect{width:100%;border:1px solid var(--line-strong);border-radius:var(--r-md);padding:10px 12px;font-family:var(--font);font-size:14.5px;color:var(--text);background:#fff;}
.ftext{min-height:60px;resize:vertical;}
.finput:focus,.ftext:focus,.fselect:focus{outline:none;border-color:var(--accent);}
.btn{display:block;width:100%;text-align:center;padding:13px;border-radius:var(--r-md);border:none;font-family:var(--font);font-weight:700;font-size:14.5px;cursor:pointer;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:disabled{opacity:.55;}
.error-box{background:var(--bad-soft);color:var(--bad);border-radius:9px;padding:12px;font-size:13px;margin-bottom:14px;}
.warn-box{background:var(--warn-soft);color:var(--warn);border-radius:9px;padding:12px;font-size:12.5px;margin-bottom:12px;line-height:1.5;}
.done-box{text-align:center;padding:14px 6px;}
.done-box .emoji{font-size:30px;margin-bottom:6px;}
.badge{display:inline-block;padding:4px 9px;border-radius:20px;font-size:10.5px;font-weight:700;}
.badge-enviado{background:var(--ok-soft);color:var(--ok);}
.badge-bloqueado{background:var(--bad-soft);color:var(--bad);}
.badge-aberto{background:var(--accent-soft);color:var(--accent-strong);}
.badge-futuro{background:var(--bg-soft);color:var(--text3);}
.daycard{border:1px solid var(--line);border-radius:var(--r-lg);padding:14px;margin-bottom:12px;}
.daycard.aberto{border-color:var(--accent);}
.daycard-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.daycard-title{font-weight:800;font-size:14.5px;}
.ppm-link{font-size:12px;color:var(--accent-strong);font-weight:700;}
.pastezone{border:2px dashed var(--line-strong);border-radius:var(--r-md);padding:16px 12px;text-align:center;font-size:12px;color:var(--text3);cursor:text;background:#fff;}
.pastezone:focus{outline:none;border-color:var(--accent);background:var(--accent-soft);}
.pastezone.filled{border-color:var(--ok);border-style:solid;}
.pastezone img{max-width:100%;border-radius:8px;margin-top:8px;display:block;}
.or-sep{text-align:center;font-size:11px;color:var(--text3);margin:8px 0;text-transform:uppercase;letter-spacing:.05em;}
.ppm-img{max-width:220px;border-radius:9px;margin-top:8px;display:block;cursor:pointer;border:1px solid var(--line);}
</style>

<script>
/* ===========================================================
   TAREFAS DE NOVATO — link do TESTER, apenas. Só mostra o
   preenchimento das próprias tarefas de Sexta/Sábado/Domingo — o
   tester NUNCA vê o mapeamento ou as tarefas de outros testers, nem
   quem é padrinho de quem (isso fica só no documento separado dos
   padrinhos, documento-padrinhos.html, com link próprio). Por isso
   essa página busca o mínimo possível: só a lista de nomes dos
   testers (pra montar o seletor) e, depois de escolher o nome, só os
   PRÓPRIOS registros de tarefa dessa pessoa (consulta filtrada por
   testerId, nunca a coleção inteira nem a ficha de outros chatters).
   Ciclo FIXO do calendário: toda Sexta é o Dia 1, todo Sábado o Dia
   2, todo Domingo o Dia 3 — prazo de cada dia é 00h00 do dia
   seguinte (vira bloqueado depois disso, critério de eliminação).
   =========================================================== */

const firebaseConfig={
  apiKey:"AIzaSyA5Q5MYehtJAU18ixZLvqS4-gQnNJJD3LI",
  authDomain:"agenciaseduct-8fd34.firebaseapp.com",
  projectId:"agenciaseduct-8fd34",

const headerSub=document.getElementById('header-sub');
const content=document.getElementById('content');

let fbDb=null;
let chatters=[];
let selTesterId=localStorage.getItem('tn_testerId')||'';
let myRawTarefaDocs=[];
let unsubMyTarefas=null;
// print do PPM: sem Firebase Storage — comprimido no navegador e enviado
// como base64 dentro do próprio documento do Firestore. diaN -> dataURL.
const pendingImages={};

// A pedido da gestora: bloqueia copiar/colar de texto por mouse ou teclado
// nessa página, pra dificultar um tester copiar a resposta de outro (o link
// é compartilhado — só troca o nome no seletor). Bloqueia botão direito
// (menu de copiar), Ctrl/Cmd+C e Ctrl/Cmd+X, e os eventos de copy/cut
// direto. Colar (Ctrl+V / paste) continua liberado só na zona de colar o
// print do PPM, que precisa disso pra funcionar.
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('copy',e=>e.preventDefault());
document.addEventListener('cut',e=>e.preventDefault());
document.addEventListener('keydown',e=>{
  const k=(e.key||'').toLowerCase();
  if((e.ctrlKey||e.metaKey)&&(k==='c'||k==='x')){e.preventDefault();}
});

function p2(n){return String(n).padStart(2,'0');}
function fmt(d){return`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;}
function getSextaDoCiclo(ref){
  const d=new Date(ref);
  const dow=d.getDay();
  let diff;
  if(dow===5)diff=0;else if(dow===6)diff=1;else if(dow===0)diff=2;else diff=dow+2;
  return new Date(d.getFullYear(),d.getMonth(),d.getDate()-diff);
}
// EXCEÇÃO PONTUAL (só pro ciclo de 31/07-02/08/2026 — a gestora teve que
// adiar a aula de Domingo pra Segunda, então SÓ dessa vez o prazo da tarefa
// do Dia 3 (Domingo) ganha +1 dia, virando meia-noite de Terça em vez de
// Segunda. Não mexe na regra normal (Sexta=Dia1/Sábado=Dia2/Domingo=Dia3,
// prazo sempre meia-noite do dia seguinte) pros próximos ciclos.
const PRAZO_DIA3_EXCECAO={'2026-07-31':1}; // fridayKey -> dias extras de prazo
function getCicloAtual(){
  const now=new Date();
  const sex=getSextaDoCiclo(now);
  const fridayKey=fmt(sex);
  const extraDia3=PRAZO_DIA3_EXCECAO[fridayKey]||0;
  const dias=[1,2,3].map(n=>{
    const dataDia=new Date(sex.getFullYear(),sex.getMonth(),sex.getDate()+(n-1));
    const extra=n===3?extraDia3:0;
    const prazo=new Date(dataDia.getFullYear(),dataDia.getMonth(),dataDia.getDate()+1+extra);
    return{dia:n,dataDia,prazo,label:['Sexta','Sábado','Domingo'][n-1]};
  });
  return{fridayKey,dias};
}
function fmtBR(d){return`${p2(d.getDate())}/${p2(d.getMonth()+1)}`;}

// ---------- Horário de teste (8 vagas + exceção fixa do Victor) ----------
// A pedido da gestora: depois de aprovado, em vez de "entraremos em contato
// pra marcar horário", a pessoa já escolhe direto 1 dos horários disponíveis
// (grupos de dias × opções de horário cada) — o horário vale pros dias do
// grupo. Uma vez escolhido por alguém, some/fica cinza pros outros (é
// sincronizado via central-dados, então todo mundo que estiver com a página
// aberta vê na hora). O Victor tem horário combinado manualmente (fora desse
// sistema de vagas) — só exibe o dele, sem picker.
// 08/08/2026 — a pedido da gestora: grupos de dias trocados por
// Segunda/Terça/Quarta e Sexta/Sábado/Domingo, cada um dividido em
// Modelo A (3 turnos de 6h: 19h-01h, 13h-19h, 01h-07h) e Modelo B (1
// turno de 6h: 07h-13h) — juntos, Modelo A + Modelo B cobrem o dia
// inteiro em blocos de 6h. Obs: a gestora escreveu "Modelo A" duas vezes
// pro grupo de Sexta/Sábado/Domingo (07h-13h) — corrigido aqui pra
// "Modelo B" pra manter a simetria com o grupo de Segunda/Terça/Quarta
// (Modelo A já tem os 3 turnos ali em cima); avisar se não era isso.
const HORARIO_SLOTS=[
  {id:'a1',grupo:'Terça, quarta e quinta — Modelo A',opcao:'Opção 1',horario:'19h-01h'},
  {id:'a2',grupo:'Terça, quarta e quinta — Modelo A',opcao:'Opção 2',horario:'13h-19h'},
  {id:'a3',grupo:'Terça, quarta e quinta — Modelo A',opcao:'Opção 3',horario:'01h-07h'},
  {id:'b1',grupo:'Sexta, sábado e domingo — Modelo A',opcao:'Opção 1',horario:'19h-01h'},
  {id:'b2',grupo:'Sexta, sábado e domingo — Modelo A',opcao:'Opção 2',horario:'13h-19h'},
  {id:'b3',grupo:'Sexta, sábado e domingo — Modelo A',opcao:'Opção 3',horario:'01h-07h'},
  {id:'c1',grupo:'Terça, quarta e quinta — Modelo B',opcao:'Opção única',horario:'07h-13h'},
  {id:'d1',grupo:'Sexta, sábado e domingo — Modelo B',opcao:'Opção única',horario:'07h-13h'}
];
function horarioSlotLabel(slot){return`${slot.grupo} · ${slot.opcao} (${slot.horario})`;}

// ---------- Entrevista por videochamada (Domingo, 19h-1h, vagas de 30min) ----------
// A pedido da gestora (07/08/2026): logo abaixo da tarefa de Domingo (Dia 3),
// a pessoa marca o horário da entrevista por videochamada — obrigatória antes
// de virar afilhado. Mesmo padrão de vagas do horário de teste: exclusivo (uma
// vez escolhido por alguém, some pros outros), sincronizado via central-dados.
// É sempre no próprio Domingo do ciclo — só o horário muda, não o dia. Cada
// vaga é uma JANELA de 30 minutos de verdade (não só um horário de início) —
// pedido explícito da gestora (07/08/2026) — por isso o rótulo mostra sempre
// início e fim (ex: 19:00–19:30), e a última vaga começa às 00:30 (termina
// 01:00) pra não passar do limite da disponibilidade (19h até 1h da manhã).
const ENTREVISTA_SLOTS=['19:00','19:30','20:00','20:30','21:00','21:30','22:00','22:30','23:00','23:30','00:00','00:30']
  .map((h,i)=>{
    const[hh,mm]=h.split(':').map(Number);
    const fimMin=(hh*60+mm+30)%(24*60);
    const fim=`${String(Math.floor(fimMin/60)).padStart(2,'0')}:${String(fimMin%60).padStart(2,'0')}`;
    return{id:'ent'+i,horario:`${h}–${fim}`};
  });
let mostrarPickerEntrevista=false;
function entrevistaHtml(tester){
  const meuSlotId=(tester.entrevista&&tester.entrevista.slotId)||localStorage.getItem('tn_entrevistaSlot_'+tester.id)||'';
  const meuSlotLabel=(tester.entrevista&&tester.entrevista.label)||(ENTREVISTA_SLOTS.find(s=>s.id===meuSlotId)||{}).horario||'';
  const aviso=`<div class="card">
    <div style="font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;margin-bottom:8px">🎥 Entrevista por videochamada</div>
    <div style="font-size:12.5px;color:var(--text2);line-height:1.5;margin-bottom:10px">Marque seu horário da entrevista por videochamada. É simples, porém é obrigatória pra gente te conhecer. Mandaremos o link de acesso da entrevista no seu privado do Discord.</div>`;
  if(meuSlotId&&!mostrarPickerEntrevista){
    return aviso+`
      <div style="padding:11px 14px;background:var(--ok-soft,#E7F5EE);color:var(--ok,#177350);border-radius:var(--r-md);font-weight:700;font-size:13.5px">🗓️ Domingo, ${meuSlotLabel}</div>
      <button class="btn" style="background:var(--bg-soft);color:var(--text2);margin-top:8px" onclick="mostrarPickerEntrevista=true;renderTesterDays(selTesterId)">🔄 Trocar horário</button>
    </div>`;
  }
  const ocupados=new Set(chatters.filter(c=>c.id!==tester.id&&c.entrevista&&c.entrevista.slotId).map(c=>c.entrevista.slotId));
  return aviso+`
    <div style="font-size:12px;color:var(--text2);margin-bottom:8px">Todos os horários são de meia em meia hora — Domingo, das 19h até 1h da madrugada.</div>
    ${ENTREVISTA_SLOTS.map(s=>{
      const ocupado=ocupados.has(s.id);
      const ehMeu=s.id===meuSlotId;
      const estilo=ocupado&&!ehMeu?'background:var(--bg-soft);color:var(--text3);border:1px solid var(--line);cursor:not-allowed':ehMeu?'background:var(--ok-soft,#E7F5EE);color:var(--ok,#177350);border:1.5px solid var(--ok,#177350)':'background:var(--accent-soft);color:var(--accent-strong);border:1px solid var(--accent-soft)';
      return`<button class="btn" ${ocupado&&!ehMeu?'disabled':''} style="margin-bottom:6px;text-align:left;padding:11px 14px;${estilo}" ${ocupado&&!ehMeu?'':`onclick="enviarEntrevista('${s.id}')"`}>${s.horario}${ocupado&&!ehMeu?' — indisponível':ehMeu?' — seu horário atual':''}</button>`;
    }).join('')}
    ${meuSlotId?`<button class="btn" style="background:var(--bg-soft);color:var(--text2);margin-top:6px" onclick="mostrarPickerEntrevista=false;renderTesterDays(selTesterId)">Cancelar</button>`:''}
  </div>`;
}
window.enviarEntrevista=async function(slotId){
  const tester=chatters.find(t=>t.id===selTesterId);
  if(!tester)return;
  const slot=ENTREVISTA_SLOTS.find(s=>s.id===slotId);
  if(!slot)return;
  try{
    await fbDb.collection('gestorpro').add({
      type:'entrevistaPendente',processado:false,
      testerId:tester.id,testerNome:tester.name,
      slotId:slot.id,slotLabel:slot.horario,
      criadoEm:firebase.firestore.FieldValue.serverTimestamp()
    });
    localStorage.setItem('tn_entrevistaSlot_'+tester.id,slot.id);
    mostrarPickerEntrevista=false;
    renderTesterDays(selTesterId);
  }catch(e){
    console.error(e);
    alert('Erro ao enviar: '+e.message);
  }
};
// ---------- Discord (10/08/2026 — a pedido da gestora) ----------
// Passo novo, entre "dados PJ enviados" e "escolher horário": o
// entrevistador (Henrique Peres) precisa do usuário do Discord de cada
// pessoa antes de falar com ela. Espelha o mesmo padrão simples do
// horário/PJ: manda um pendente pro Firestore, marca localStorage
// otimisticamente, e o app.js aplica no chatter (c.discordUsername).
function discordHtml(tester){
  return`<div class="card">
    <div style="font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;margin-bottom:8px">💬 Seu usuário do Discord</div>
    <div style="font-size:12.5px;color:var(--text2);margin-bottom:10px">É pra quem vai te entrevistar conseguir te chamar por lá.</div>
    <div class="field">
      <label class="flabel">Usuário do Discord</label>
      <input class="finput" id="discord-username" placeholder="ex: seu_usuario">
    </div>
    <button class="btn btn-primary" id="btn-enviar-discord" onclick="enviarDiscord()">Enviar</button>
  </div>`;
}
window.enviarDiscord=async function(){
  const tester=chatters.find(t=>t.id===selTesterId);
  if(!tester)return;
  const discordUsername=(document.getElementById('discord-username')?.value||'').trim();
  if(!discordUsername){alert('Preencha seu usuário do Discord.');return;}
  const btn=document.getElementById('btn-enviar-discord');
  btn.disabled=true;btn.textContent='Enviando...';
  try{
    await fbDb.collection('gestorpro').add({
      type:'discordPendente',processado:false,
      testerId:tester.id,testerNome:tester.name,discordUsername,
      criadoEm:firebase.firestore.FieldValue.serverTimestamp()
    });
    localStorage.setItem('tn_discordEnviado_'+tester.id,'1');
    renderTesterDays(selTesterId);
  }catch(e){
    console.error(e);
    alert('Erro ao enviar: '+e.message);
    btn.disabled=false;btn.textContent='Enviar';
  }
};
let mostrarPickerHorario=false;
function horarioTesteHtml(tester){
  // Exceção do horário fixo do Victor foi removida (03/08/2026, a pedido da
  // gestora) — todo mundo usa o mesmo sistema de 6 vagas agora, sem
  // exceção manual pra ninguém.
  const meuSlotId=(tester.horarioTeste&&tester.horarioTeste.slotId)||localStorage.getItem('tn_horarioSlot_'+tester.id)||'';
  const meuSlotLabel=(tester.horarioTeste&&tester.horarioTeste.label)||HORARIO_SLOTS.find(s=>s.id===meuSlotId)&&horarioSlotLabel(HORARIO_SLOTS.find(s=>s.id===meuSlotId))||'';
  if(meuSlotId&&!mostrarPickerHorario){
    return`<div class="card">
      <div style="font-size:11px;font-weight:700;color:var(--ok,#177350);text-transform:uppercase;margin-bottom:6px">🗓️ Seu horário de teste escolhido</div>
      <div style="font-size:14px;font-weight:700;margin-bottom:10px">${meuSlotLabel}</div>
      <button class="btn" style="background:var(--bg-soft);color:var(--text2)" onclick="mostrarPickerHorario=true;renderTesterDays(selTesterId)">🔄 Trocar horário</button>
    </div>`;
  }
  // Achado 10/08/2026 — a gestora corrigiu o critério: esses horários NÃO
  // são amarrados à decisão (aprovado/reprovado) — são amarrados À SEMANA.
  // Cada leva de testers entra no domingo e o horário escolhido só vale
  // durante aquela semana; no domingo seguinte a vaga fica livre de novo
  // pra próxima leva, não importa o que aconteceu com quem escolheu antes.
  // Por isso: só conta como ocupado quem escolheu DEPOIS do último domingo
  // (ciclo atual) — qualquer escolha de uma semana anterior expira sozinha.
  const agoraH=new Date();
  const ultimoDomingoH=new Date(agoraH);
  ultimoDomingoH.setHours(0,0,0,0);
  ultimoDomingoH.setDate(ultimoDomingoH.getDate()-ultimoDomingoH.getDay());
  const ocupados=new Set(chatters.filter(c=>c.id!==tester.id&&c.horarioTeste&&c.horarioTeste.slotId&&c.horarioTeste.escolhidoEm&&new Date(c.horarioTeste.escolhidoEm)>=ultimoDomingoH).map(c=>c.horarioTeste.slotId));
  const grupos=[...new Set(HORARIO_SLOTS.map(s=>s.grupo))];
  return`<div class="card">
    <div style="font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;margin-bottom:8px">🗓️ Nossos horários de teste disponíveis</div>
    <div style="font-size:12.5px;color:var(--text2);margin-bottom:10px">Escolha 1 horário — ele vale pros 3 dias do grupo. Assim que alguém escolhe, a opção fica indisponível pros outros.</div>
    ${grupos.map(g=>`
      <div style="font-size:12px;font-weight:700;margin:10px 0 6px">${g}</div>
      ${HORARIO_SLOTS.filter(s=>s.grupo===g).map(s=>{
        const ocupado=ocupados.has(s.id);
        const ehMeu=s.id===meuSlotId;
        // Achado 03/08/2026 — a pedido da gestora: fundo colorido em vez de
        // branco liso pra ficar mais bonito/fácil de ver de relance.

// IMPORTANTE (achado em 31/07/2026): o limite de largura (900px) sozinho não
// garantia um tamanho máximo — print de celular é uma imagem ALTA (não só
// larga), então mesmo limitando a largura o print inteiro podia passar de
// 250-300KB dependendo do aparelho/detalhe da tela. Agora comprime até caber
// num orçamento de tamanho de verdade — reduz a qualidade e, se ainda não
// couber, reduz o tamanho também — em vez de só limitar a largura e torcer.
//
// Orçamento apertado de propósito (achado em 31/07/2026, a pedido da
// gestora): as tarefas de tester têm fatia própria no Firestore
// (shard-tarefas-tester, ~1MB), mas ela quer garantir espaço pra receber uns
// 15 testers ao mesmo tempo, cada um com 3 prints (1 por dia). 15×3=45
// prints — com ~14KB cada (esse orçamento), dá ~630KB dos ~1024KB
// disponíveis, deixando folga de sobra até pra alguém que precise refazer o
// ciclo (pedido de segunda chance). Um print de resultado de teste de
// digitação é só texto/números numa tela simples — dá pra comprimir bem sem
// perder legibilidade.
const PPM_MAX_BASE64_CHARS=15000; // ~14.6KB — cabe uns 15 testers com 3 prints cada e ainda sobra espaço
function fileToCompressedDataUrl(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        let w=img.width,h=img.height;
        const maxW=520;
        if(w>maxW){h=Math.round(h*maxW/w);w=maxW;}
        const canvas=document.createElement('canvas');
        canvas.width=w;canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        let quality=0.55;
        let dataUrl=canvas.toDataURL('image/jpeg',quality);
        let tentativas=0;
        while(dataUrl.length>PPM_MAX_BASE64_CHARS&&quality>0.15&&tentativas<10){
          quality-=0.05;
          dataUrl=canvas.toDataURL('image/jpeg',quality);
          tentativas++;
        }
        // Print muito grande/detalhado mesmo na qualidade mínima — reduz o
        // tamanho físico também (redesenha menor a partir do canvas já
        // reduzido, sem reler o arquivo original), repetindo até caber ou
        // até ficar pequeno demais pra valer a pena (não trava em loop).
        let canvasAtual=canvas,wAtual=w,hAtual=h,encolhidas=0;
        while(dataUrl.length>PPM_MAX_BASE64_CHARS&&encolhidas<4&&wAtual>120){
          wAtual=Math.round(wAtual*0.7);hAtual=Math.round(hAtual*0.7);
          const canvasMenor=document.createElement('canvas');
          canvasMenor.width=wAtual;canvasMenor.height=hAtual;
          canvasMenor.getContext('2d').drawImage(canvasAtual,0,0,wAtual,hAtual);
          canvasAtual=canvasMenor;
          dataUrl=canvasAtual.toDataURL('image/jpeg',0.4);
          encolhidas++;
        }
        resolve(dataUrl);
      };
      img.onerror=()=>reject(new Error('Não consegui ler essa imagem.'));
      img.src=reader.result;
    };
    reader.onerror=()=>reject(new Error('Não consegui ler esse arquivo.'));
    reader.readAsDataURL(file);
  });
}

function renderAll(){
  // A pedido da gestora (07/08/2026): quem já teve decisão (aprovado/
  // reprovado/reservas) some da lista de seleção pra sempre depois de
  // decidido — a lista deve mostrar só quem ainda está no processo:
  // afilhados aguardando avaliação (com padrinho, sem decisão) e quem
  // está no ciclo atual. Antes ficava tudo acumulado pra sempre (ex:
  // Henrique Spagnolo, aprovado há semanas, ainda aparecia no seletor).
  // Quem já foi decidido e ainda não tinha o id salvo neste navegador
  // (cache local) não vai mais achar o nome aqui pra rever a tela de
  // resultado — troca consciente, a gestora topou o risco.
  const testers=chatters.filter(c=>c.time==='tester'&&!c.testerDecision);
  headerSub.textContent='Sexta / Sábado / Domingo — ciclo da semana atual';
  // Se essa pessoa acabou de se autoincluir (pendingAutoNome no localStorage)
  // e agora já apareceu na lista com esse nome, seleciona ela automaticamente
  // — ela não sabe o próprio id, só o nome que digitou.
  const pendingNome=localStorage.getItem('tn_pendingAutoNome');
  if(pendingNome&&!selTesterId){
    const norm=s=>(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
    const match=testers.find(t=>norm(t.name)===norm(pendingNome));
    if(match){
      selTesterId=match.id;
      localStorage.setItem('tn_testerId',match.id);
      localStorage.removeItem('tn_pendingAutoNome');
    }
  }
  if(!testers.length&&!pendingNome){
    // Não é preciso Mapeamento nenhum pra se cadastrar aqui — o mapeamento é
    // uma ferramenta interna que só a gestora/padrinhos usam depois, pra
    // avaliar quem já está no processo. Quem chega aqui e não acha o nome se
    // inclui direto, sem esperar ninguém.
    content.innerHTML=`<div class="warn-box">Nenhum tester cadastrado ainda — use "Não achei meu nome" abaixo pra se incluir direto, sem precisar de ninguém.</div>${autoinclusaoHtml()}`;
    attachAutoinclusaoHandlers();
    return;
  }
  let testerAtual=selTesterId?testers.find(t=>t.id===selTesterId):null;
  if(selTesterId&&!testerAtual){
    // Acabou de se autoincluir (ver enviarAutoinclusao) e ainda não
    // sincronizou de volta — o app da gestora só processa o cadastro
    // quando ela está com o app aberto, então pode levar um tempo. Enquanto
    // isso, mostra a tela de tarefas mesmo assim com um objeto mínimo local
    // (não volta pro formulário de cadastro). Assim que sincronizar de
    // verdade, o match por id acima passa a achar o registro real sozinho.
    const nomePendente=localStorage.getItem('tn_pendingAutoNome');
    if(nomePendente){
      testerAtual={id:selTesterId,name:nomePendente,time:'tester',pendenteAprovacao:false};
    }else{
      selTesterId='';
    }
  }
  if(testerAtual){
    // A pedido da gestora: assim que a pessoa já tem nome cadastrado (guardado
    // neste navegador), some a opção de selecionar/cadastrar nome de novo — a
    // página já carrega direto no nome dela, pra evitar cadastro duplicado.
    content.innerHTML=`
      <div class="card" style="display:flex;align-items:center;justify-content:space-between;gap:10px">
        <div style="font-size:14.5px;font-weight:800">👤 ${testerAtual.name}</div>
        <a href="javascript:void(0)" onclick="trocarTester()" style="font-size:11px;color:var(--text3);font-weight:700;white-space:nowrap">Não é você? trocar</a>
      </div>
      <div id="tester-days"></div>
    `;
    subscribeMyTarefas(selTesterId);
    return;
  }
  content.innerHTML=`
    <div class="card">
      <div class="field" style="margin-bottom:0">
        <label class="flabel">Selecione seu nome</label>
        <select class="fselect" id="tester-select" onchange="onTesterChange(this.value)">
          <option value="">— selecionar —</option>
          ${testers.map(t=>`<option value="${t.id}">${t.name}</option>`).join('')}
        </select>
      </div>
    </div>
    ${pendingNome?'<div class="warn-box">⏳ Só um instante, estamos te cadastrando (isso é automático, não precisa de aprovação de ninguém) — pode levar alguns segundos. Deixe essa página aberta ou volte daqui a pouco pra já começar suas tarefas.</div>':autoinclusaoHtml()}
    <div id="tester-days"></div>
  `;

}

function tsMillis(ts){
  if(!ts)return 0;
  if(typeof ts.toMillis==='function')return ts.toMillis();
  if(ts.seconds)return ts.seconds*1000;
  return 0;
}
function getMinhasTarefas(){
  const base={};
  myRawTarefaDocs.filter(d=>d.fridayKey&&d.dia).forEach(d=>{
    if(!base[d.fridayKey])base[d.fridayKey]={};
    const key='dia'+d.dia;
    const existing=base[d.fridayKey][key];
    const rawTime=tsMillis(d.criadoEm)||Date.now();
    const existingTime=existing&&existing.enviadoEm?new Date(existing.enviadoEm).getTime():0;
    if(!existing||rawTime>=existingTime){
      base[d.fridayKey][key]={resumo:d.resumo||'',disponibilidade:d.disponibilidade||'',cincoNotadas:d.cincoNotadas||'',ppmImage:d.ppmImage||'',enviadoEm:new Date(rawTime).toISOString()};
    }
  });
  return base;
}
function getStatusDia(fridayKey,diaN,dataDia,prazo){
  const tarefas=getMinhasTarefas();
  const reg=tarefas[fridayKey]&&tarefas[fridayKey]['dia'+diaN];
  if(reg&&reg.enviadoEm)return'enviado';
  const agora=new Date();
  if(agora>=prazo){
    // Segunda chance aprovada pelo padrinho pra esse dia específico —
    // volta a ficar "aberto" mesmo com o prazo já vencido.
    const tester=chatters.find(t=>t.id===selTesterId);
    const liberado=(tester?.segundaChanceAprovadas||[]).some(s=>s.fridayKey===fridayKey&&s.dia===diaN);
    if(liberado)return'aberto';
    return'bloqueado';
  }
  // A pedido da gestora (08/08/2026): a tarefa de cada dia só libera às 16h
  // daquele dia (antes ficava "aberto" desde meia-noite) — até lá fica
  // trancada ("futuro"), mesmo já sendo o dia certo.
  const inicioDia=new Date(dataDia.getFullYear(),dataDia.getMonth(),dataDia.getDate(),16,0,0,0);
  if(agora>=inicioDia)return'aberto';
  return'futuro';
}
// Cache só desta sessão (a página não lê a ficha do tester, só o array de
// chatters) — depois de pedir segunda chance, lembra que já pediu pra não
// mostrar o botão de novo, até a página recarregar.
const segundaChancePedida=new Set();
function renderTesterDays(testerId){
  const el=document.getElementById('tester-days');
  if(!el)return;
  const tester=chatters.find(t=>t.id===testerId);
  if(tester&&tester.testerDecision==='reprovado'){
    el.innerHTML=`<div class="card" style="text-align:center">
      <div style="font-size:30px;margin-bottom:8px">😊</div>
      <div style="font-size:14.5px">Obrigada pela participação! Seus resultados ainda não foram o suficiente para vaga no momento, mas pode tentar novamente quando quiser 😊</div>
    </div>`;
    return;
  }
  // 10/08/2026 — a pedido explícito da gestora: essa mensagem de "resultado
  // não foi suficiente" só pode aparecer quando o tester for REALMENTE
  // reprovado (testerDecision==='reprovado', tratado acima). Antes também
  // aparecia pra quem simplesmente ainda não tinha sido apadrinhado quando o
  // prazo de Domingo passava — mas isso não significa reprovação, só que
  // ninguém decidiu ainda (ou está em avaliação), e estava confundindo todo
  // mundo nessa situação com quem foi de fato reprovado. Removido: agora
  // quem está sem padrinho e sem decisão só vê a tela normal de tarefas
  // (com os dias já bloqueados, se for o caso).
  if(tester&&tester.temPadrinho){
    // Gatilho é o APADRINHAMENTO (padrinho aprovado pra essa pessoa), não o
    // testerDecision — esse último é uma decisão SEPARADA e posterior
    // (aprovado/reprovado/reservas depois dos 3 dias de tarefa, decidida na
    // aba Testers). Achado em 03/08/2026: a gestora apadrinhou o Fred e
    // nada mudou na página dele, porque essa tela só olhava testerDecision,
    // que só é setado bem depois — o apadrinhamento sozinho nunca chegava
    // a acionar essa tela.
    // "Já enviou os dados PJ" precisa ser uma verdade PERSISTENTE (server +
    // localStorage), não só a mensagem trocada na hora no DOM — mesmo bug já
    // corrigido antes no formulário de "meus dados" (ver comentário em
    // meusDadosHtml): sem isso, qualquer sync vindo do app da gestora
    // reconstruía o formulário de PJ do zero por cima da confirmação. A
    // gestora só recebe um FLAG (dadosPjRecebidos=true, sem nenhum dado
    // sensível) espelhado no chatter — o CNPJ/pix/endereço em si continuam
    // só na Ficha (nunca voltam pro link público).
    const jaEnviouPJ=tester.dadosPjRecebidos||localStorage.getItem('tn_dadosPjEnviado_'+tester.id)==='1';
    // Ordem combinada com a gestora (06/08/2026, revisada; 10/08/2026 —
    // adicionado o passo do Discord entre dados PJ e horário): 1) mensagem
    // de parabéns citando o padrinho + documentação (dados PJ); 2) usuário
    // do Discord (o entrevistador precisa disso pra falar com a pessoa);
    // 3) escolha de horário; 4) tela final de boas-vindas.
    const jaEnviouDiscord=!!tester.discordUsername||localStorage.getItem('tn_discordEnviado_'+tester.id)==='1';
    const jaEscolheuHorario=!!(tester.horarioTeste&&tester.horarioTeste.slotId)||!!localStorage.getItem('tn_horarioSlot_'+tester.id);

window.mostrarEdicaoTarefa=function(diaN,fridayKey){
  const f=document.getElementById('edit-form-'+diaN);

  const tarefas=getMinhasTarefas();
  const reg=tarefas[fridayKey]&&tarefas[fridayKey]['dia'+diaN];
  pendingEditImages[diaN]=(reg&&reg.ppmImage)||'';

window.handlePastePPMEdit=async function(e,diaN){
  e.preventDefault();
  const items=(e.clipboardData&&e.clipboardData.items)||[];
  let file=null;
  for(const it of items){if(it.kind==='file'&&it.type&&it.type.startsWith('image/')){file=it.getAsFile();break;}}
  if(!file){alert('Não encontrei nenhuma imagem colada — copie o print (Ctrl+C / botão direito → copiar imagem) e cole aqui de novo (Ctrl+V).');return;}
  await setPendingEditPPM(diaN,file);
};
window.handleFilePPMEdit=async function(e,diaN){
  const file=e.target.files&&e.target.files[0];
  if(!file)return;
  await setPendingEditPPM(diaN,file);
};
async function setPendingEditPPM(diaN,file){
  try{
    const dataUrl=await fileToCompressedDataUrl(file);
    pendingEditImages[diaN]=dataUrl;
    const zone=document.getElementById('edit-pastezone-'+diaN);
    if(zone){
      zone.innerHTML=`<img src="${dataUrl}"><div style="margin-top:6px;font-weight:700;color:var(--ok)">✅ Novo print anexado — clique aqui pra trocar de novo</div>`;
    }
  }catch(err){
    console.error(err);
    alert('Não consegui processar essa imagem, tente outra.');
  }
}
window.salvarEdicaoTarefa=async function(diaN,fridayKey){
  const testerId=selTesterId;
  if(!testerId)return;
  const tester=chatters.find(c=>c.id===testerId);
  if(!tester)return;
  const resumo=(document.getElementById('edit-resumo-'+diaN)?.value||'').trim();
  if(!resumo){alert('O resumo não pode ficar vazio.');return;}
  const ppmImage=pendingEditImages[diaN];
  if(!ppmImage){alert('Anexe (ou mantenha) o print do resultado do PPM antes de salvar.');return;}
  const btn=document.getElementById('btn-salvar-edit-'+diaN);
  if(btn){btn.disabled=true;btn.textContent='Salvando...';}
  try{
    const payload={
      type:'tarefaNovatoPendente',processado:false,
      testerId,testerNome:tester.name,
      fridayKey,dia:diaN,
      resumo,ppmImage,
      editadoEm:firebase.firestore.FieldValue.serverTimestamp(),
      criadoEm:firebase.firestore.FieldValue.serverTimestamp()
    };
    if(diaN===1)payload.disponibilidade=(document.getElementById('edit-disponibilidade-'+diaN)?.value||'').trim();
    if(diaN===2)payload.cincoNotadas=(document.getElementById('edit-cincoNotadas-'+diaN)?.value||'').trim();

    delete pendingEditImages[diaN];
    const f=document.getElementById('edit-form-'+diaN);
    if(f)f.style.display='none';
  }catch(e){
    console.error(e);
    alert('Erro ao salvar edição: '+e.message);
    if(btn){btn.disabled=false;btn.textContent='💾 Salvar edição';}
  }

function meusDadosHtml(tester){
  if(!tester)return'';

  // innerHTML trocado na hora — sem isso, qualquer atualização vinda do app
  // da gestora (o que acontece o tempo todo, é uma tela ao vivo) disparava
  // renderAll() de novo antes do servidor confirmar o envio, e esse
  // re-render reconstruía o formulário do zero por cima da confirmação,
  // fazendo ela sumir. Checando local + servidor, a resposta fica fixada
  // assim que enviada, não pisca mais de volta pro formulário. A pedido da
  // gestora: NÃO mostra nenhuma mensagem de "parabéns/chatter teste" aqui —
  // só fixa a resposta que a pessoa já deu.
  const resposta=(tester.dadosAutoInformados&&tester.dadosAutoInformados.sobreVoce)||localStorage.getItem('tn_meusDadosResposta_'+tester.id)||'';
  if(resposta){
    const seguro=resposta.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    return`<div class="card" id="meus-dados-card">
      <div style="font-size:11px;font-weight:700;color:var(--ok,#177350);margin-bottom:6px">✅ Resposta enviada</div>

  return`<div class="card" id="meus-dados-card">
    <div class="field" style="margin-bottom:8px">
      <label class="flabel">Se seu futuro padrinho pudesse te conhecer melhor e saber o que você procura com o trabalho, o que você contaria para ele? *</label>

  </div>`;
}
window.enviarMeusDados=async function(){

  if(!sobreVoce){alert('Esse campo é obrigatório: conte pro seu futuro padrinho o que você procura no trabalho.');return;}
  const btn=document.getElementById('md-salvar-btn');
  if(btn){btn.disabled=true;btn.textContent='Enviando...';}

    await fbDb.collection('gestorpro').add({
      type:'testerDadosPendente',processado:false,
      testerId:tester.id,
      sobreVoce,
      criadoEm:firebase.firestore.FieldValue.serverTimestamp()
    });

    if(btn){btn.disabled=false;btn.textContent='Salvar';}
  }
};

    ['razaoSocial','Razão Social'],['nickname','Nickname'],['cnpj','CNPJ'],
    ['endereco','Endereço de sede'],['numero','Número'],['bairro','Bairro'],['cep','Cep'],
    ['telefone','Telefone/Celular'],['email','E-mail'],['pix','Pix'],['bancoChave','Banco e chave'],
    ['falaIngles','Fala inglês']
  ];
  const faltando=obrigatorios.filter(([id])=>!val(id)).map(([,label])=>label);
  if(faltando.length)return`Preencha os campos obrigatórios que faltaram: ${faltando.join(', ')}.`;
  const cnpjDigitos=val('cnpj').replace(/\D/g,'');
  if(cnpjDigitos.length!==14)return'O CNPJ precisa ter 14 dígitos (formato válido de CNPJ).';
  const telDigitos=val('telefone').replace(/\D/g,'');
  if(telDigitos.length<10)return'O telefone precisa incluir o DDD (mínimo 10 dígitos, com o número).';
  const email=val('email');
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return'O e-mail informado não parece válido — confira e tente de novo.';
  return'';
}
function normalizarTexto(s){
  return(s||'').toString().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim();
}
// 10/08/2026 — a pedido explícito da gestora, depois do caso do Wesley (que
// preencheu um CNPJ de familiar e ela só descobriu porque ele mesmo contou
// depois): antes o aviso "precisa ser CNPJ próprio" era só um texto — não
// travava nada de verdade. Agora consulta a Receita Federal (via BrasilAPI,
// pública/gratuita, sem chave) e confere se o nome cadastrado no app aparece
// na razão social, nome fantasia ou no quadro de sócios (QSA) do CNPJ. Se
// não bater, BLOQUEIA o envio de vez (não deixa prosseguir) até corrigir.
// Se a consulta falhar (rede/CORS/CNPJ não encontrado na base), não trava
// todo mundo à toa — pede confirmação manual e sinaliza isso pra gestora
// conferir depois (fica marcado no Dados PJ como "não verificado").
async function checarCnpjProprio(cnpjDigitos,nomeTester){
  try{
    const resp=await Promise.race([
      fetch(`https://brasilapi.com.br/api/cnpj/v1/${cnpjDigitos}`),
      new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),9000))
    ]);
    if(!resp.ok)return{status:'nao_encontrado'};
    const data=await resp.json();
    const nomesEnvolvidos=[data.razao_social,data.nome_fantasia,...(Array.isArray(data.qsa)?data.qsa.map(s=>s.nome_socio):[])].map(normalizarTexto);
    const textoBusca=nomesEnvolvidos.join(' | ');
    const partesNome=normalizarTexto(nomeTester).split(/\s+/).filter(p=>p.length>2&&!['dos','das','de','da','do'].includes(p));
    const bateu=partesNome.length>0&&partesNome.every(p=>textoBusca.includes(p));
    return{status:bateu?'ok':'nao_bate',razaoSocial:data.razao_social,socios:(data.qsa||[]).map(s=>s.nome_socio)};
  }catch(e){
    console.error('Erro ao consultar CNPJ na Receita',e);
    return{status:'erro_consulta'};
  }
}
window.enviarDadosPJ=async function(){
  const tester=chatters.find(t=>t.id===selTesterId);
  if(!tester)return;
  const val=id=>(document.getElementById('pj-'+id)?.value||'').trim();
  const erro=validarDadosPJ(val);
  if(erro){alert(erro);return;}
  const btn=document.getElementById('btn-enviar-pj');
  btn.disabled=true;btn.textContent='Verificando CNPJ...';
  const cnpjDigitos=val('cnpj').replace(/\D/g,'');
  const check=await checarCnpjProprio(cnpjDigitos,tester.name);
  if(check.status==='nao_bate'){
    alert(`⚠️ Esse CNPJ NÃO está no seu nome (${tester.name}).\n\nRazão Social encontrada na Receita: ${check.razaoSocial||'—'}${check.socios&&check.socios.length?'\nSócio(s): '+check.socios.join(', '):''}\n\nÉ obrigatório usar um CNPJ próprio, no seu nome — não é possível prosseguir com um CNPJ de outra pessoa. Corrija o campo e tente de novo.`);
    btn.disabled=false;btn.textContent='Enviar dados';
    return;
  }
  if(check.status==='nao_encontrado'||check.status==='erro_consulta'){
    if(!confirm(`Não consegui confirmar automaticamente na Receita se esse CNPJ está no seu nome (não encontrado, ou a consulta falhou). Você TEM CERTEZA que é um CNPJ próprio, no seu nome? Isso vai ficar marcado como "não verificado" pra gestora conferir manualmente.`)){
      btn.disabled=false;btn.textContent='Enviar dados';
      return;
    }
  }
  btn.textContent='Enviando...';
  try{
    await fbDb.collection('gestorpro').add({
      type:'dadosPjPendente',processado:false,
      testerId:tester.id,
      razaoSocial:val('razaoSocial'),nickname:val('nickname'),cnpj:val('cnpj'),
      endereco:val('endereco'),numero:val('numero'),bairro:val('bairro'),cep:val('cep'),
      telefone:val('telefone'),email:val('email'),pix:val('pix'),bancoChave:val('bancoChave'),
      falaIngles:val('falaIngles'),
      trelloEmail:val('trelloEmail'),telegramNumero:val('telegramNumero'),telegramNome:val('telegramNome'),
      cnpjVerificado:check.status==='ok',
      cnpjRazaoSocialReceita:check.razaoSocial||'',
      criadoEm:firebase.firestore.FieldValue.serverTimestamp()
    });
    localStorage.setItem('tn_dadosPjEnviado_'+tester.id,'1');
    renderTesterDays(selTesterId);
  }catch(e){
    console.error(e);
    alert('Erro ao enviar: '+e.message);
    btn.disabled=false;btn.textContent='Enviar dados';
  }
};
window.enviarTarefaDia=async function(diaN){
  const testerId=selTesterId;
  if(!testerId){alert('Selecione seu nome primeiro.');return;}
  const tester=chatters.find(c=>c.id===testerId);
  if(!tester)return;
  const ciclo=getCicloAtual();
  const diaInfo=ciclo.dias.find(d=>d.dia===diaN);
  const status=getStatusDia(ciclo.fridayKey,diaN,diaInfo.dataDia,diaInfo.prazo);
  if(status!=='aberto'){alert('Esse dia não está mais disponível pra envio.');renderTesterDays(testerId);return;}
  const ppmImage=pendingImages[diaN];
  if(!ppmImage){alert('Anexe (escolha o arquivo ou cole com Ctrl+V) o print do resultado do teste de PPM antes de enviar.');return;}
  const resumo=(document.getElementById('campo-resumo-'+diaN)?.value||'').trim();
  if(!resumo){alert('Escreva o resumo pedido antes de enviar.');return;}
  const btn=document.getElementById('btn-enviar-dia-'+diaN);
  btn.disabled=true;btn.textContent='Enviando...';
  try{
    const payload={
      type:'tarefaNovatoPendente',processado:false,
      testerId,testerNome:tester.name,
      fridayKey:ciclo.fridayKey,dia:diaN,
      resumo,ppmImage,
      criadoEm:firebase.firestore.FieldValue.serverTimestamp()
    };
    if(diaN===1)payload.disponibilidade=(document.getElementById('campo-disponibilidade-1')?.value||'').trim();
    if(diaN===2)payload.cincoNotadas=(document.getElementById('campo-cincoNotadas-2')?.value||'').trim();
    await fbDb.collection('gestorpro').doc(tarefaDocId(testerId,ciclo.fridayKey,diaN)).set(payload);
    delete pendingImages[diaN];
  }catch(e){
    console.error(e);
    alert('Erro ao enviar: '+e.message);
    if(btn){btn.disabled=false;btn.textContent='📤 Enviar tarefa do dia';}
  }
};
