<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Documento dos Padrinhos — GestorPro</title>
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
:root{
  --bg:#FFFFFF;--bg-soft:#FBF6F7;--line:#F0E2E5;--line-strong:#E5CFD5;
  --text:#241A1D;--text2:#7A6A6E;--text3:#B5A1A6;
  --accent:#E8779B;--accent-soft:#FCEAF0;--accent-strong:#D85C84;
  --ok:#177350;--ok-soft:#E7F5EE;--warn:#9A5B00;--warn-soft:#FBF0DD;
  --bad:#B42334;--bad-soft:#FBEAEA;
  --r-sm:8px;--r-md:10px;--r-lg:14px;
  --font:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{background:var(--bg-soft);}
body{font-family:var(--font);color:var(--text);min-height:100dvh;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;padding:18px 14px 60px;}
.wrap{max-width:620px;margin:0 auto;}
.header{text-align:center;margin-bottom:16px;padding-top:8px;}
.header .eyebrow{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-strong);margin-bottom:4px;}
.header h1{font-size:20px;font-weight:800;}
.header .sub{font-size:12.5px;color:var(--text3);margin-top:4px;}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;margin-bottom:12px;}
.field{margin-bottom:12px;}
.flabel{display:block;font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.03em;margin-bottom:6px;}
.fselect{width:100%;border:1px solid var(--line-strong);border-radius:var(--r-md);padding:10px 12px;font-family:var(--font);font-size:14.5px;color:var(--text);background:#fff;}
.fselect:focus{outline:none;border-color:var(--accent);}
.btn{display:block;width:100%;text-align:center;padding:13px;border-radius:var(--r-md);border:none;font-family:var(--font);font-weight:700;font-size:14.5px;cursor:pointer;}
.btn-primary{background:var(--accent);color:#fff;}
.warn-box{background:var(--warn-soft);color:var(--warn);border-radius:9px;padding:12px;font-size:12.5px;margin-bottom:12px;line-height:1.5;}
.error-box{background:var(--bad-soft);color:var(--bad);border-radius:9px;padding:12px;font-size:13px;margin-bottom:14px;}
.badge{display:inline-block;padding:4px 9px;border-radius:20px;font-size:10.5px;font-weight:700;}
.badge-enviado{background:var(--ok-soft);color:var(--ok);}
.badge-bloqueado{background:var(--bad-soft);color:var(--bad);}
.badge-aberto{background:var(--accent-soft);color:var(--accent-strong);}
.badge-futuro{background:var(--bg-soft);color:var(--text3);}
.tarefa-desc{font-size:12.5px;color:var(--text2);line-height:1.6;background:var(--bg-soft);border-radius:8px;padding:10px 12px;margin-bottom:10px;}
.tester-row{border:1px solid var(--line);border-radius:var(--r-lg);padding:14px;margin-bottom:12px;}
.tester-row-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;cursor:pointer;}
.tester-name{font-weight:800;font-size:14.5px;}
.tester-mapinfo{font-size:12px;color:var(--text2);margin-top:4px;line-height:1.5;}
.badges-row{display:flex;gap:6px;margin-top:8px;}
.claimbox{border:1px dashed var(--line-strong);border-radius:10px;padding:11px 12px;margin-top:10px;font-size:12.5px;}
.ppm-img{max-width:220px;border-radius:9px;margin-top:8px;display:block;cursor:pointer;border:1px solid var(--line);}
.detail-body{display:none;margin-top:10px;border-top:1px solid var(--line);padding-top:10px;}
.detail-body.open{display:block;}
.chev{font-size:16px;color:var(--text3);}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="header">
    <div class="eyebrow">GestorPro · Agência Seduct</div>
    <h1>👑 Documento dos Padrinhos</h1>
    <div class="sub" id="header-sub">Carregando...</div>
  </div>
  <div id="content"></div>
</div>
<div id="lightbox" onclick="closeLightbox()" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:999;align-items:center;justify-content:center;padding:20px;cursor:zoom-out">
  <img id="lightbox-img" style="max-width:100%;max-height:100%;border-radius:8px">
</div>

<script src="firebase-bundle.js"></script>
<script>
/* ===========================================================
   DOCUMENTO DOS PADRINHOS — link SEPARADO do link de tarefas dos
   testers (tarefas-novato.html). Só quem recebe ESTE link vê: o
   mapeamento de cada tester, as tarefas dos 3 dias que já
   preencheram e a caixa de reivindicação de afilhado (atualiza ao
   vivo pra todos os padrinhos que estiverem olhando). Os testers
   nunca veem essa página — o link de tarefas deles não tem acesso a
   nada disso, só ao próprio preenchimento.
   =========================================================== */

const firebaseConfig={
  apiKey:"AIzaSyA5Q5MYehtJAU18ixZLvqS4-gQnNJJD3LI",
  authDomain:"agenciaseduct-8fd34.firebaseapp.com",
  projectId:"agenciaseduct-8fd34",
  storageBucket:"agenciaseduct-8fd34.firebasestorage.app",
  messagingSenderId:"232929088781",
  appId:"1:232929088781:web:b278bd92bf9bdc857e4c44"
};

const headerSub=document.getElementById('header-sub');
const content=document.getElementById('content');

let fbDb=null;
let chatters=[],mapeamentoBatches=[],chatterFichasLive={},afilhadoClaimsLive=[];
// tarefasNovato mora numa fatia própria do Firestore desde 31/07/2026 (não
// mais dentro de chatterFichasLive/shard-fichas) — documento dedicado só
// pros prints de PPM de quem ainda está em teste, sem dividir o orçamento
// de ~1MB com a Ficha de todo mundo já contratado.
let tarefasNovatoLive={};
let rawTarefaDocs=[],rawClaimDocs=[];
let selPadrinhoId=localStorage.getItem('tn_padrinhoId')||'';
let expandedTester='';

function normNome(s){return(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();}
window.openLightbox=function(src){document.getElementById('lightbox-img').src=src;document.getElementById('lightbox').style.display='flex';};
window.closeLightbox=function(){document.getElementById('lightbox').style.display='none';};

/* ---------- ciclo Sexta/Sábado/Domingo (mesma lógica do app.js) ---------- */
function p2(n){return String(n).padStart(2,'0');}
function fmt(d){return`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;}
function getSextaDoCiclo(ref){
  const d=new Date(ref);
  const dow=d.getDay();
  let diff;
  if(dow===5)diff=0;else if(dow===6)diff=1;else if(dow===0)diff=2;else diff=dow+2;
  return new Date(d.getFullYear(),d.getMonth(),d.getDate()-diff);
}
function getCicloAtual(){
  const now=new Date();
  const sex=getSextaDoCiclo(now);
  const fridayKey=fmt(sex);
  const dias=[1,2,3].map(n=>{
    const dataDia=new Date(sex.getFullYear(),sex.getMonth(),sex.getDate()+(n-1));
    const prazo=new Date(dataDia.getFullYear(),dataDia.getMonth(),dataDia.getDate()+1);
    return{dia:n,dataDia,prazo,label:['Sexta','Sábado','Domingo'][n-1]};
  });
  return{fridayKey,dias};
}

/* ---------- init ---------- */
if(typeof firebase==='undefined'){
  headerSub.textContent='Erro de conexão';
  content.innerHTML='<div class="error-box">Não consegui carregar a conexão com o Gestor. Verifique sua internet e recarregue a página.</div>';
}else{
  init();
}
function init(){
  try{
    firebase.apps&&firebase.apps.length?firebase.app():firebase.initializeApp(firebaseConfig);
    fbDb=firebase.firestore();
    headerSub.textContent='Selecione seu nome pra ver o documento';
    content.innerHTML='<div class="warn-box">Carregando dados...</div>';
    startListeners();
  }catch(e){
    console.error(e);
    headerSub.textContent='Erro de conexão';
    content.innerHTML='<div class="error-box">Erro ao conectar: '+e.message+'</div>';
  }
}
function startListeners(){
  fbDb.collection('gestorpro').doc('central-dados').onSnapshot(doc=>{
    if(!doc.exists)return;
    const remote=doc.data();
    if(remote&&remote.payload){
      try{
        const parsed=JSON.parse(remote.payload);
        chatters=parsed.chatters||[];
        mapeamentoBatches=parsed.mapeamentoBatches||[];
        afilhadoClaimsLive=parsed.afilhadoClaims||[];
        renderAll();
      }catch(e){console.error('Erro ao ler central-dados',e);}
    }
  },e=>console.error('Erro central-dados',e));
  fbDb.collection('gestorpro').doc('shard-fichas').onSnapshot(doc=>{
    if(!doc.exists)return;
    const remote=doc.data();
    if(remote&&remote.payload){
      try{
        const parsed=JSON.parse(remote.payload);
        chatterFichasLive=parsed.chatterFichas||{};
        renderAll();
      }catch(e){console.error('Erro ao ler shard-fichas',e);}
    }
  },e=>console.error('Erro shard-fichas',e));
  fbDb.collection('gestorpro').doc('shard-tarefas-tester').onSnapshot(doc=>{
    if(!doc.exists)return;
    const remote=doc.data();
    if(remote&&remote.payload){
      try{
        const parsed=JSON.parse(remote.payload);
        tarefasNovatoLive=parsed.tarefasNovatoPorTester||{};
        renderAll();
      }catch(e){console.error('Erro ao ler shard-tarefas-tester',e);}
    }
  },e=>console.error('Erro shard-tarefas-tester',e));
  fbDb.collection('gestorpro').where('type','==','tarefaNovatoPendente').onSnapshot(snap=>{
    rawTarefaDocs=snap.docs.map(d=>d.data());
    renderAll();
  },e=>console.error('Erro tarefas pendentes',e));
  fbDb.collection('gestorpro').where('type','==','afilhadoClaimPendente').onSnapshot(snap=>{
    rawClaimDocs=snap.docs.map(d=>d.data());
    renderAll();
  },e=>console.error('Erro claims pendentes',e));
}

/* ---------- merges ---------- */
function tsMillis(ts){
  if(!ts)return 0;
  if(typeof ts.toMillis==='function')return ts.toMillis();
  if(ts.seconds)return ts.seconds*1000;
  return 0;
}
function getMergedTarefas(testerId){
  const base=JSON.parse(JSON.stringify(tarefasNovatoLive[testerId]||{}));
  rawTarefaDocs.filter(d=>d.testerId===testerId&&d.fridayKey&&d.dia).forEach(d=>{
    if(!base[d.fridayKey])base[d.fridayKey]={};
    const key='dia'+d.dia;
    const existingReg=base[d.fridayKey][key];
    const rawTime=tsMillis(d.criadoEm)||Date.now();
    const existingTime=existingReg&&existingReg.enviadoEm?new Date(existingReg.enviadoEm).getTime():0;
    if(!existingReg||rawTime>=existingTime){
      base[d.fridayKey][key]={resumo:d.resumo||'',disponibilidade:d.disponibilidade||'',cincoNotadas:d.cincoNotadas||'',ppmImage:d.ppmImage||'',ppmUrl:d.ppmUrl||'',enviadoEm:new Date(rawTime).toISOString()};
    }
  });
  return base;
}
function getStatusDia(testerId,fridayKey,diaN,dataDia,prazo){
  const tarefas=getMergedTarefas(testerId);
  const reg=tarefas[fridayKey]&&tarefas[fridayKey]['dia'+diaN];
  if(reg&&reg.enviadoEm)return'enviado';
  const agora=new Date();
  if(agora>=prazo)return'bloqueado';
  const inicioDia=new Date(dataDia.getFullYear(),dataDia.getMonth(),dataDia.getDate());
  if(agora>=inicioDia)return'aberto';
  return'futuro';
}
function getMergedClaimForTester(testerId){
  const central=afilhadoClaimsLive.find(c=>c.testerId===testerId&&['pendente','aprovado','reservado'].includes(c.status));
  if(central)return central;
  const raws=rawClaimDocs.filter(d=>d.testerId===testerId).sort((a,b)=>tsMillis(b.criadoEm)-tsMillis(a.criadoEm));
  if(raws.length)return{testerId,testerNome:raws[0].testerNome,padrinhoId:raws[0].padrinhoId,padrinhoNome:raws[0].padrinhoNome,status:'pendente'};
  return null;
}
function getMapeamentoInfo(testerId,nome){
  // Casa primeiro pelo ID do tester (mais confiável — evita mostrar o
  // mapeamento da pessoa errada quando há nomes repetidos/duplicados),
  // e só cai pro nome como reserva pra entradas antigas que ainda não
  // tinham esse vínculo salvo.
  let byId=null,byName=null;
  [...mapeamentoBatches].forEach(b=>(b.results||[]).forEach(r=>{
    if(testerId&&r.chatterId===testerId)byId=r;
    else if(!byName&&normNome(r.nome)===normNome(nome))byName=r;
  }));
  return byId||byName;
}
function hasAnyTarefaEnviada(testerId){
  // Verifica em TODOS os ciclos (não só o atual) se essa pessoa já
  // enviou alguma tarefa — usado pra só liberar a exclusão de nomes que
  // realmente nunca fizeram nada, nunca de quem já participou.
  const base=tarefasNovatoLive[testerId]||{};
  const temNaFatia=Object.keys(base).some(fk=>Object.keys(base[fk]||{}).some(k=>base[fk][k]&&base[fk][k].enviadoEm));
  if(temNaFatia)return true;
  return rawTarefaDocs.some(d=>d.testerId===testerId);
}

/* ---------- render ---------- */
function renderAll(){
  // Inclui quem já teve decisão (aprovado/reprovado) também — senão a
  // pessoa some da lista assim que é aprovada (vira time==='basico') e o
  // padrinho perde o acesso à avaliação/mapeamento dela bem na hora que
  // isso passa a importar mais (mesmo ajuste feito em tarefas-novato.html).
  const testers=chatters.filter(c=>c.time==='tester'||c.testerDecision);
  // Padrinho é um CARGO à parte do nível principal (ex: alguém pode ser
  // Sênior e Padrinho ao mesmo tempo, ver task de "2 cargos por chatter") —
  // por isso considera tanto level==='padrinho' quanto a flag isPadrinho,
  // senão quem tem outro nível principal (ex: José, Eduardo) some da lista.
  const padrinhos=chatters.filter(c=>c.level==='padrinho'||c.isPadrinho);
  headerSub.textContent='Mapeamento + tarefas de cada tester, atualizado ao vivo';
  if(!padrinhos.length){
    content.innerHTML='<div class="warn-box">Nenhum chatter marcado como 👑 Padrinho ainda — peça pra gestora definir o cargo na aba Equipe.</div>';
    return;
  }
  if(selPadrinhoId&&!padrinhos.some(p=>p.id===selPadrinhoId))selPadrinhoId='';
  content.innerHTML=`
    <div class="card">
      <div class="field" style="margin-bottom:0">
        <label class="flabel">Selecione seu nome (padrinho)</label>
        <select class="fselect" id="padrinho-select" onchange="onPadrinhoChange(this.value)">
          <option value="">— selecionar —</option>
          ${padrinhos.map(p=>`<option value="${p.id}" ${selPadrinhoId===p.id?'selected':''}>${p.name}</option>`).join('')}
        </select>
      </div>
    </div>
    <div id="padrinho-doc"></div>
  `;
  renderDocumentoPadrinhos(testers);
}
window.onPadrinhoChange=function(id){selPadrinhoId=id;localStorage.setItem('tn_padrinhoId',id);renderDocumentoPadrinhos(chatters.filter(c=>c.time==='tester'||c.testerDecision));};
window.toggleTesterDetail=function(id){expandedTester=expandedTester===id?'':id;renderDocumentoPadrinhos(chatters.filter(c=>c.time==='tester'||c.testerDecision));};
function renderDocumentoPadrinhos(testers){
  const el=document.getElementById('padrinho-doc');
  if(!el)return;
  if(!testers.length){el.innerHTML='<div class="warn-box">Nenhum tester ativo no momento.</div>';return;}
  const ciclo=getCicloAtual();
  el.innerHTML=testers.map(t=>{
    const map=getMapeamentoInfo(t.id,t.name);
    const claim=getMergedClaimForTester(t.id);
    const podeExcluir=!t.testerDecision&&!hasAnyTarefaEnviada(t.id);
    const padrinhoId=(chatterFichasLive[t.id]&&chatterFichasLive[t.id].padrinhoId)||'';
    const isMine=selPadrinhoId&&padrinhoId===selPadrinhoId;
    const badges=ciclo.dias.map(d=>{
      const status=getStatusDia(t.id,ciclo.fridayKey,d.dia,d.dataDia,d.prazo);
      const label={enviado:'✅',bloqueado:'❌',aberto:'🟢',futuro:'⏳'}[status];
      return`<span class="badge badge-${status}">${label} ${d.label.slice(0,3)}</span>`;
    }).join('');
    const open=expandedTester===t.id;
    const tarefas=getMergedTarefas(t.id)[ciclo.fridayKey]||{};
    const expColor=map?.experienciaProfissional==='boa'?'var(--ok)':map?.experienciaProfissional==='média'?'var(--warn)':'var(--bad)';
    const ehDomingo=new Date().getDay()===0; // reivindicação só abre aos domingos, pedido da gestora
    const claimBoxHtml=(()=>{
      if(padrinhoId){
        const padrinhoAtual=chatters.find(c=>c.id===padrinhoId);
        return`<div class="claimbox">👑 Padrinho aprovado: <strong>${padrinhoAtual?padrinhoAtual.name:'—'}</strong>
          ${isMine?`<div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap">
            <a class="btn btn-primary" style="text-decoration:none;flex:1;min-width:140px" href="avaliacao.html?id=${encodeURIComponent(t.id)}&nome=${encodeURIComponent(t.name)}">📜 Avalie seu afiliado</a>
            <button class="btn" style="background:var(--bad-soft);color:var(--bad);flex:0 0 auto;padding:13px 14px" title="Liberar esse afilhado pra outro padrinho" onclick="deserdarAfilhado('${t.id}','${(t.name||'').replace(/'/g,"\\'")}')">💔 Deserdar</button>
          </div>`:''}
        </div>`;
      }
      if(claim){
        const meta={pendente:['⏳ Solicitação pendente de decisão da gestora','var(--warn)'],reservado:['🔵 Solicitação reservada pela gestora','var(--text2)']}[claim.status]||['⏳ Pendente','var(--warn)'];
        return`<div class="claimbox">👑 Reivindicado por: <strong>${claim.padrinhoNome}</strong><div style="margin-top:4px;color:${meta[1]};font-weight:700;font-size:11.5px">${meta[0]}</div></div>`;
      }
      if(!ehDomingo){
        return`<div class="claimbox">Ninguém reivindicou esse tester ainda.<div style="margin-top:6px;color:var(--text3)">🗓️ Reivindicações só abrem aos domingos.</div></div>`;
      }
      return`<div class="claimbox">Ninguém reivindicou esse tester ainda.
        ${selPadrinhoId?`<button class="btn btn-primary" style="margin-top:8px" onclick="reivindicarAfilhado('${t.id}','${(t.name||'').replace(/'/g,"\\'")}')">🙋 Quero apadrinhar</button>`:'<div style="margin-top:6px;color:var(--text3)">Selecione seu nome de padrinho acima pra poder reivindicar.</div>'}
      </div>`;
    })();
    return`<div class="tester-row">
      <div class="tester-row-head" onclick="toggleTesterDetail('${t.id}')">
        <div>
          <div class="tester-name">${t.name}${t.testerDecision==='aprovado'?' <span style="font-size:11px;font-weight:700;color:var(--ok)">✅ Aprovado</span>':t.testerDecision==='reprovado'?' <span style="font-size:11px;font-weight:700;color:var(--bad)">❌ Reprovado</span>':''}</div>
          ${map?`<div class="tester-mapinfo">"${map.personalidadeUmaFrase||''}" ${map.pontuacaoGeral?`· 🎯 ${map.pontuacaoGeral}/100`:''}</div>`:''}
          ${map?.experienciaProfissional?`<div class="tester-mapinfo">💼 Experiência profissional: <strong style="color:${expColor};text-transform:uppercase">${map.experienciaProfissional}</strong></div>`:''}
          <div class="badges-row">${badges}</div>
        </div>
        <span class="chev">${open?'▲':'▼'}</span>
      </div>
      <div class="detail-body ${open?'open':''}">
        ${map?`<div class="tarefa-desc">${map.resumo||''}</div>`:''}
        ${map?.experienciaProfissionalMotivo?`<div class="tarefa-desc">💼 <strong>Experiência profissional:</strong> ${map.experienciaProfissionalMotivo}</div>`:''}
        ${ciclo.dias.map(d=>{
          const reg=tarefas['dia'+d.dia];
          if(!reg)return'';
          return`<div style="margin-bottom:10px">
            <div style="font-weight:700;font-size:12.5px;margin-bottom:4px">${d.label} — Dia ${d.dia}</div>
            ${reg.resumo?`<div style="font-size:12.5px;color:var(--text2);margin-bottom:3px">📝 ${reg.resumo}</div>`:''}
            ${reg.disponibilidade?`<div style="font-size:12.5px;color:var(--text2);margin-bottom:3px">🗓️ ${reg.disponibilidade}</div>`:''}
            ${reg.cincoNotadas?`<div style="font-size:12.5px;color:var(--text2);margin-bottom:3px">👀 ${reg.cincoNotadas}</div>`:''}
            ${(reg.ppmImage||reg.ppmUrl)?`<img class="ppm-img" src="${reg.ppmImage||reg.ppmUrl}" onclick="openLightbox(this.src)">`:''}
          </div>`;
        }).join('')}
        ${segundaChanceHtml(t.id)}
        ${claimBoxHtml}
        ${podeExcluir?`<button class="btn" style="margin-top:10px;background:var(--bad-soft);color:var(--bad)" onclick="event.stopPropagation();excluirNomeDuplicado('${t.id}','${(t.name||'').replace(/'/g,"\\'")}')">🗑️ Excluir esse nome (duplicado, nunca enviou tarefa)</button>`:''}
      </div>
    </div>`;
  }).join('');
}
function segundaChanceHtml(testerId){
  const reqs=((chatterFichasLive[testerId]&&chatterFichasLive[testerId].segundaChanceRequests)||[]).filter(r=>r.status==='pendente');
  if(!reqs.length)return'';
  return reqs.map(r=>`<div class="claimbox" style="border-color:var(--warn)">
    🙏 Pediu segunda chance — Dia ${r.dia}
    <div style="font-size:12px;color:var(--text2);margin:6px 0">${r.justificativa||''}</div>
    <div style="display:flex;gap:8px">
      <button class="btn btn-primary" style="flex:1;background:var(--ok)" onclick="decidirSegundaChance('${testerId}','${r.fridayKey}',${r.dia},'aprovado')">✅ Aprovar</button>
      <button class="btn btn-primary" style="flex:1;background:var(--bad)" onclick="decidirSegundaChance('${testerId}','${r.fridayKey}',${r.dia},'recusado')">❌ Recusar</button>
    </div>
  </div>`).join('');
}
window.decidirSegundaChance=async function(testerId,fridayKey,dia,decisao){
  if(!selPadrinhoId){alert('Selecione seu nome de padrinho primeiro.');return;}
  const padrinho=chatters.find(c=>c.id===selPadrinhoId);
  try{
    await fbDb.collection('gestorpro').add({
      type:'segundaChanceDecisaoPendente',processado:false,
      testerId,fridayKey,dia,decisao,padrinhoNome:padrinho?.name||'',
      criadoEm:firebase.firestore.FieldValue.serverTimestamp()
    });
  }catch(e){
    console.error(e);
    alert('Erro ao enviar decisão: '+e.message);
  }
};
window.excluirNomeDuplicado=async function(testerId,testerNome){
  // Só chega até aqui um botão que já checou (podeExcluir) que essa pessoa
  // nunca teve decisão nem tarefa enviada. Mesmo assim, quem realmente
  // executa a exclusão é o app principal (aplicarExclusaoTesterPendente),
  // que confere tudo de novo antes de apagar — pedido da gestora pra nunca
  // arriscar apagar algo real por engano.
  if(!selPadrinhoId){alert('Selecione seu nome de padrinho primeiro.');return;}
  if(!confirm(`Excluir "${testerNome}"? Use só pra nomes duplicados que nunca enviaram nenhuma tarefa — isso será checado de novo antes de apagar de verdade.`))return;
  const padrinho=chatters.find(c=>c.id===selPadrinhoId);
  try{
    await fbDb.collection('gestorpro').add({
      type:'excluirTesterPendente',processado:false,
      testerId,testerNome,
      padrinhoId:selPadrinhoId,padrinhoNome:padrinho?padrinho.name:'',
      criadoEm:firebase.firestore.FieldValue.serverTimestamp()
    });
    alert('Pedido enviado — some da lista em instantes se realmente não tiver nenhuma tarefa registrada.');
  }catch(e){
    console.error(e);
    alert('Erro ao enviar: '+e.message);
  }
};
window.deserdarAfilhado=async function(testerId,testerNome){
  if(!selPadrinhoId){alert('Selecione seu nome de padrinho primeiro.');return;}
  if(!confirm(`Deserdar "${testerNome}"? Ele volta pra lista de quem ainda não tem padrinho, disponível pra qualquer padrinho reivindicar num próximo domingo.`))return;
  const padrinho=chatters.find(c=>c.id===selPadrinhoId);
  try{
    await fbDb.collection('gestorpro').add({
      type:'deserdarPendente',processado:false,
      testerId,testerNome,
      padrinhoId:selPadrinhoId,padrinhoNome:padrinho?padrinho.name:'',
      criadoEm:firebase.firestore.FieldValue.serverTimestamp()
    });
  }catch(e){
    console.error(e);
    alert('Erro ao enviar: '+e.message);
  }
};
window.reivindicarAfilhado=async function(testerId,testerNome){
  if(!selPadrinhoId){alert('Selecione seu nome de padrinho primeiro.');return;}
  const padrinho=chatters.find(c=>c.id===selPadrinhoId);
  if(!padrinho)return;
  const existing=getMergedClaimForTester(testerId);
  if(existing){alert('Esse tester já tem uma solicitação em aberto.');return;}
  try{
    await fbDb.collection('gestorpro').add({
      type:'afilhadoClaimPendente',processado:false,
      testerId,testerNome,
      padrinhoId:selPadrinhoId,padrinhoNome:padrinho.name,
      criadoEm:firebase.firestore.FieldValue.serverTimestamp()
    });
  }catch(e){
    console.error(e);
    alert('Erro ao enviar: '+e.message);
  }
};
</script>
