const PLAYBOOK_CATALOGO=`
ESCALA DE TEMPERATURA (Manual de Aplicação — 1 a 10):
1 GELADO (zero sinal) · 2 FRIO (respostas curtas, sem emoção) · 3 ESQUENTANDO (pergunta de você ou conta de si) · 4 MORNO (primeira insinuação leve) · 5 PEDIU PRA VER ("manda uma foto" — NÃO é sinal de compra) · 6 IMAGINANDO (ele descreve, se solta) · 7 NO LIMITE (pico de ansiedade, pergunta preço) · 8 DECISÃO (pergunta preço/insiste/pressa — sinal real de disposição a pagar) · 9 SATISFAÇÃO (comprou) · 10 VÍNCULO (pós-venda).
Regra por faixa: 1-6 é tudo gratuito (gancho leve só no 5-6, nunca mídia paga); 7-8 é o ponto de oferta, sempre respeitando a escada do script (nunca pular 1→2→3); 9-10 é rapport antes de emendar a próxima venda.

10 ARQUÉTIPOS DE LEAD (Manual de Tipos de Lead + Tom e Gatilhos):
Carente (busca companhia; tom acolhedor; gatilhos Rótulo Emocional + Reciprocidade) · Submisso (quer ser conduzido; tom firme/assertivo; gatilhos Autoridade de Especialista + Compromisso e Coerência) · Namorado (quer fantasia de relacionamento; tom íntimo/caloroso; gatilhos Antecipação do Futuro + Rótulo Emocional) · Fetichista (o mais lucrativo, não o mais estranho; tom curioso sem julgamento; gatilhos Autoridade de Especialista + Escassez Real) · Salvador (quer cuidar de você; tom vulnerável com moderação; gatilhos Reciprocidade + Compromisso e Coerência) · Curioso (está testando; tom leve sem pressão; gatilhos Loop Aberto + Reciprocidade) · Punheteiro (quer entrega rápida, não vínculo; tom direto/eficiente; gatilhos Fechamento Alternativo + Escassez Real) · Dominador (quer sentir que manda; tom confiante nunca submisso; gatilhos Efeito Contraste + Fechamento Alternativo) · Fã que não compra (interage mas não converte; tom amigável sem esforço extra; gatilhos Retirada da Oferta + Escassez Real) · Narcisista (quer validação; tom admirador genuíno; gatilhos Reciprocidade + Autoridade de Especialista invertida).

9 TÉCNICAS DE NEGOCIAÇÃO: Ancoragem (fale o preço primeiro) · Silêncio Depois do Preço (fale e espere) · Escada de Concessão (nunca ceda sem pedir algo em troca) · Enquadramento (como descreve o preço muda a resposta) · Espelhamento (repita o ritmo dele) · Rótulo Emocional (nomeie a objeção antes dele) · Perguntas Calibradas ("o que faria valer a pena pra você") · Aversão à Perda (mostre o que ele perde) · Escassez Real (nunca invente prazo).

8 TÉCNICAS AVANÇADAS DE PERSUASÃO: Reciprocidade · Compromisso e Coerência · Efeito Contraste · Retirada da Oferta · Fechamento Alternativo · Loop Aberto (Curiosidade) · Antecipação do Futuro · Autoridade de Especialista. Nunca empilhar mais de uma técnica na mesma mensagem — isso soa artificial.

SINAIS DE WHALE (Manual de Criação de Whale): 3+ compras espaçadas, intervalo curto e constante, pagou sem regatear, ticket subindo, compartilhou algo pessoal sem ser perguntado. Quando presentes: não vender rápido, investir em conexão.

REGRA DE VENDA RÁPIDA (turno 15h-23h, maior volume): pedido espontâneo de personalizado/whats já é sinal de compra — vender na hora; quando a oferta parte do chatter, sempre validar com sexting antes; nunca ofertar preço alto pra quem não validou.

ERROS CLÁSSICOS DO PLAYBOOK (usar como catálogo de erro, não inventar outros): pular etapa de script, oferecer mídia paga sem ter passado por sexting, ceder desconto sem pedir nada em troca, mandar mídia de graça quando só pediram "pra ver", sumir depois de mandar conteúdo, usar escassez falsa, empilhar mais de uma técnica de persuasão na mesma mensagem, tratar todo mundo com o mesmo tom independente do arquétipo, discutir preço em vez de reforçar valor, vender antes de aquecer, fala mecânica/robótica (mensagem genérica que ignora o que o assinante acabou de dizer), mandar mídias em sequência sem criar contexto/conversa entre elas, subir o preço da mídia de forma brusca sem progressão gradual, reaproveitar o mesmo roteiro de PPV storytelling com um lead que já recusou nele (só vale uma vez por lead), vender mídia por valor muito baixo desvalorizando a modelo (ex: R$5-8).

PPV COM STORYTELLING (Manual de Vendas de PPV com Storytelling — venda de mídia como sequência narrativa erótica contínua, não mídia avulsa; usar pra avaliar Criatividade, Inteligência Comercial e Condução): o chatter é roteirista guiando a imaginação do lead, não vendedor desesperado — foco no LTV (quanto o lead rende ao longo de toda a história), não só no ticket de uma venda isolada. Preço: nunca fixo, nunca vender baixo demais e desvalorizar a modelo, progressão gradual sem saltos (não pular de R$20 pra R$100), etapas finais/mais explícitas valem mais (R$80-150), se o lead paga bem sem reclamar pode subir o preço sem medo pra testar até onde ele vai. Estratégia: ganha-se na quantidade de mídias vendidas aos poucos (R$15+R$20+R$30... rende mais que 1 vídeo caro só), sempre fazer o lead demonstrar curiosidade/pedir antes de ofertar (nunca ofertar de cara), ofertar no contexto do que ele acabou de falar, só pular direto pras mídias finais se o lead já estiver muito excitado. Condução: abrir descrevendo o que a persona está fazendo naquele momento (gera curiosidade), trocar 5-10 mensagens de conexão entre cada mídia enviada, manter mistério (nunca entregar tudo de uma vez), sempre guiar a narrativa. Cada roteiro de storytelling só pode ser usado UMA vez por lead — se ele não comprou a primeira mídia, guardar o roteiro pra outro cliente em vez de insistir.

COMO PUXAR ASSUNTO (Manual "Como Puxar Assunto com Assinantes" — usar pra diagnosticar e corrigir fala mecânica, tipo o problema do Renan):
"Não tenho assunto" é mito — todo assinante entrega deixa, o trabalho é achar e puxar o fio, não inventar do zero. Fluxo em 3 passos: 1) PERGUNTA ABERTA (nunca fechada tipo "tudo bem?"/"curtiu?" — pergunta que puxa opinião, gosto, o que faria, ex: "como tá sendo seu dia?" em vez de "tudo bem?") pra coletar informação real sobre a pessoa; 2) FALAR DO QUE ELE GOSTA (uma vez descoberto o assunto, ir fundo nele em vez de tentar inventar outro — a pessoa se sente ouvida e valorizada, isso sozinho já gera vínculo); 3) CONTAR UMA HISTÓRIA PARECIDA DA PERSONA depois que ele se abriu (reciprocidade — conversa não pode ser só interrogatório, ela também precisa "soltar" informação, sempre coerente com o que já contou antes pra essa pessoa).
Erros de fala mecânica a apontar: rajada de perguntas fechadas em sequência, resposta genérica que não usa nada do que o assinante acabou de escrever (soa robótico/copiado e colado), não ler o histórico da conversa antes de responder (a deixa muitas vezes já está lá em cima), só perguntar sem nunca contribuir com algo próprio (interrogatório), forçar assunto quando a pessoa claramente não está afim (nem toda conversa depende do chatter — às vezes é só o momento errado da pessoa, não é falha dele).

CUIDADO COM TAREFAS/METAS DE TEMPO: nunca sugira desafio ou tarefa de treino do tipo "feche uma venda em X minutos" ou qualquer meta que force o chatter a apressar o lead pulando a escada de temperatura — isso pressiona o assinante, quebra a régua 1→2→...→8 do script e tende a atrapalhar mais do que ajudar. Toda tarefa de treino/autoteste sugerida deve ser sobre PRATICAR uma técnica específica (ex: "aplique pergunta aberta em pelo menos 3 conversas essa semana"), nunca sobre bater um prazo ou meta de tempo de fechamento.

const AI_PROXY_URL='/api/claude';

function aiQuotaError(data){
  const raw=typeof data?.error==='string'?data.error:(data?.error?.message||'');
  if(/quota|rate.?limit/i.test(raw)){
    const m=raw.match(/(\d+)\s*s\b/i);
    const err=new Error(raw||'Limite de uso da IA no momento — costuma voltar sozinho em cerca de 1 minuto.');
    err.quota=true;
    err.waitSeconds=m?parseInt(m[1],10):60;
    return err;
  }
  return null;
}
async function clFetchAI(system,userContent,maxTokens){
  const res=await fetch(AI_PROXY_URL,{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:maxTokens,system,messages:[{role:'user',content:userContent}]})
  });
  const data=await res.json();
  const text=data.content?.map(b=>b.type==='text'?b.text:'').join('')||'';
  if(!text){
    const qerr=aiQuotaError(data);
    if(qerr)throw qerr;
  }
  return text;
}
// Quando você RESPONDE (cita) uma mensagem específica no chat, o app de
// mensagens gera um bloco de 3 linhas: o NOME de quem mandou a mensagem
// citada, a mensagem citada (repetida — já apareceu antes na conversa) e só
// então a resposta nova de verdade. Esse NOME sozinho confunde a IA sobre
// quem é quem (às vezes é o nome de quem NÃO está falando ali). Detecta esse
// padrão (nome sozinho seguido de uma linha que já apareceu antes) e remove
// as duas linhas, deixando só a resposta nova.
function limparNomesDeRespostaCitada(conv){
  if(!conv)return conv;
  const linhas=conv.split('\n');
  const vistas=new Set();
  const nomeRegex=/^\p{Lu}[\p{Ll}'’]{1,20}$/u;
  const out=[];
  for(let i=0;i<linhas.length;i++){
    const linha=linhas[i];
    const norm=linha.trim().toLowerCase();
    if(norm&&nomeRegex.test(linha.trim())&&i+1<linhas.length){
      const proximaRaw=linhas[i+1].trim();
      const temLetra=/\p{L}/u.test(proximaRaw);
      const ehHorario=/^\d{1,2}:\d{2}$/.test(proximaRaw);
      const proxima=proximaRaw.toLowerCase();
      if(temLetra&&!ehHorario&&proxima&&vistas.has(proxima)){
        i++;
        continue;
      }
    }
    if(norm)vistas.add(norm);
    out.push(linha);
  }
  return out.join('\n');
}
function clMd(md){
  return md
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/^## (.+)$/gm,'<h3>$1</h3>')
    .replace(/^### (.+)$/gm,'<h4>$1</h4>')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/^---$/gm,'<hr>')
    .replace(/^\|(.+)\|$/gm,row=>{
      const cells=row.slice(1,-1).split('|');
      if(cells.every(c=>/^[-\s:]+$/.test(c)))return'';
      return'<tr>'+cells.map(c=>`<td>${c.trim()}</td>`).join('')+'</tr>';
    })
    .replace(/(<tr>[\s\S]*?<\/tr>\n?)+/g,'<table>$&</table>')
    .replace(/^[-*] (.+)$/gm,'<li>$1</li>')
    .replace(/^\d+\. (.+)$/gm,'<li>$1</li>')
    .replace(/(<li[\s\S]*?<\/li>\n?)+/g,'<ul>$&</ul>')
    .replace(/\n{2,}/g,'<br>');
}

function ocultarPlanoTreinamento(md){

// Mesma semana Segunda-Domingo usada no app principal (getMondayOfWeek /
// getWeekKey em app.js) — duplicada aqui pra essa página funcionar sozinha.
function getMondayOfWeek(d){
  const dow=d.getDay();
  const diff=dow===0?6:dow-1;
  const mon=new Date(d);
  mon.setDate(d.getDate()-diff);
  mon.setHours(0,0,0,0);
  return mon;
}
function fmtYMD(d){return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function currentWeekKey(){return fmtYMD(getMondayOfWeek(new Date()));}
function weekBoundsNow(){
  const mon=getMondayOfWeek(new Date());
  const sun=new Date(mon);sun.setDate(mon.getDate()+6);sun.setHours(23,59,59,999);
  return[mon,sun];
}
function weekKeyToLabel(wk){
  const[y,m,d]=wk.split('-').map(Number);
  const mon=new Date(y,m-1,d);
  const sun=new Date(mon);sun.setDate(mon.getDate()+6);
  return`${mon.getDate()}/${mon.getMonth()+1} – ${sun.getDate()}/${sun.getMonth()+1}`;
}

// Calcula métricas objetivas da semana (mesma lógica do app principal) —
// só pra acompanhar junto no doc pendente, o chatter não vê números aqui.
function calcMetricasSemana(analises){
  const comIgp=analises.filter(a=>a.igp!=null);
  const avgIGP=comIgp.length?Math.round(comIgp.reduce((s,a)=>s+(a.igp||0),0)/comIgp.length):null;
  const tagged=analises.filter(a=>a.tags);
  const taxaConversao=tagged.length?Math.round(tagged.filter(a=>a.tags.converteu==='sim').length/tagged.length*100):null;
  const arqTally={};
  tagged.forEach(a=>{if(a.tags.arquetipo)arqTally[a.tags.arquetipo]=(arqTally[a.tags.arquetipo]||0)+1;});
  const topArquetipo=Object.entries(arqTally).sort((a,b)=>b[1]-a[1])[0]?.[0]||null;
  const whaleCount=tagged.filter(a=>a.tags.sinalDeWhale).length;
  return{avgIGP,taxaConversao,topArquetipo,whaleCount};
}
async function carregarRelatorioSemanal(){

    let mine=[];
    if(doc.exists&&doc.data().payload){
      const parsed=JSON.parse(doc.data().payload);
      mine=(parsed.chatlabWeeklyReports&&parsed.chatlabWeeklyReports[chatterId])||[];
    }
    const atual=mine.find(r=>r.weekKey===wk);
    if(atual){
      const origem=atual.generatedBy==='chatter'?'gerado por você':'gerado pela sua gestora';
      el.innerHTML=`<div style="font-size:11px;color:var(--text3);margin-bottom:8px">${weekKeyToLabel(wk)} · ${atual.analisesCount||0} análise${(atual.analisesCount||0)>1?'s':''} · ${origem}</div>
        <div class="cl-md">${clMd(atual.rawChatter||atual.rawGestora||'')}</div>
        <button class="btn btn-ghost" style="margin-top:10px" onclick="gerarMeuRelatorioSemanal()">🔄 Gerar de novo (atualiza com análises novas)</button>`;
    }else{
      el.innerHTML=`<div style="font-size:12.5px;color:var(--text2);margin-bottom:10px">Ainda não tem relatório dessa semana (${weekKeyToLabel(wk)}).</div>
        <button class="btn btn-primary" id="btn-relatorio" onclick="gerarMeuRelatorioSemanal()">📅 Gerar meu relatório da semana</button>`;
    }
  }catch(e){
    console.error(e);
    el.innerHTML='<div style="color:var(--text3);font-size:12.5px">Não consegui carregar o relatório semanal agora.</div>';
  }
}
window.gerarMeuRelatorioSemanal=async function(){
  const el=document.getElementById('relatorio-semanal');
  const btn=document.getElementById('btn-relatorio');
  if(btn){btn.disabled=true;btn.textContent='Gerando…';}
  el.innerHTML='<div style="text-align:center;padding:20px;color:var(--text2);font-size:13px">⏳ Sintetizando o relatório da semana…</div>';
  try{
    const[start,end]=weekBoundsNow();
    const doc=await fbDb.collection('gestorpro').doc('shard-chatlab').get();
    let all=[];
    if(doc.exists&&doc.data().payload){
      const parsed=JSON.parse(doc.data().payload);
      all=parsed.chatlabAnalyses||[];
    }
    const analises=all.filter(a=>a.chatterId===chatterId&&a.date&&new Date(a.date)>=start&&new Date(a.date)<=end).sort((a,b)=>(a.date||'').localeCompare(b.date||''));
    if(!analises.length){
      el.innerHTML='<div class="error-box">Ainda não tem nenhuma análise sua registrada essa semana — analise pelo menos uma conversa acima antes de gerar o relatório.</div>';
      return;
    }
    const wk=currentWeekKey();
    const metrics=calcMetricasSemana(analises);
    const contexto=analises.map((a,i)=>`Análise ${i+1} — ${new Date(a.date).toLocaleDateString('pt-BR',{day:'2-digit',month:'short'})} — IGP ${a.igp||'—'}${a.tags?.principalErro?` — erro principal: ${a.tags.principalErro}`:''}${a.tags?.converteu?` — converteu: ${a.tags.converteu}`:''}${a.tags?.arquetipo?` — arquétipo: ${a.tags.arquetipo}`:''}\n${a.resumo||''}`).join('\n\n---\n\n');
    const system=`Você é a Gerente Sênior de Performance de uma operação de vendas por chat, usando EXATAMENTE o playbook interno abaixo (não critérios genéricos). Baseie-se só nas análises fornecidas, nunca invente dado que não está lá.\n\n${PLAYBOOK_CATALOGO}`;
    const prompt=`Chatter: ${chatterNome||'chatter'}. Semana: ${weekKeyToLabel(wk)} (${analises.length} análise${analises.length>1?'s':''} de conversa registrada${analises.length>1?'s':''}, rodadas por ele mesmo e/ou pela gestora).\n\nRESUMOS DAS ANÁLISES DA SEMANA:\n${contexto}\n\nEscreva DUAS versões do relatório semanal, nessa ordem exata:\n\n1) VERSÃO PRA GESTORA (Markdown, direto, analítico, com evidência de cada análise) com exatamente estas seções:\n## 💪 Pontos Fortes\n## ⚠️ Fraquezas\n## 📈 O Que Melhorou\n## 🎯 Perfil Deste Chatter (diga se ele tende bem pra venda rápida, prioriza conexão/vínculo, ou prioriza qualificar o lead antes de tudo — com evidência das análises, pra gestora saber onde ele funciona mais)\n## 🧭 Tipo de Lead Que Ele Atende Melhor (qual arquétipo de lead ele converte/conduz melhor)\n## 🗣️ Como É a Condução da Conversa\n## 🔴 Problemas Mais Frequentes (ranqueados por quantas vezes apareceram — só o que está nos dados)\n## 🎯 Plano Pra Próxima Semana (uma ação concreta por problema)\n\n2) Logo em seguida, um bloco \`\`\`chatter contendo a versão PRO PRÓPRIO CHATTER ler — tom completamente diferente: informal, simples, como se fosse um chatter mais experiente dando dica de colega pra colega, NUNCA se apresentando como gerente/gestora ou usando linguagem formal. Cubra: o que ele mandou bem essa semana, os erros mais comuns em linguagem simples e como corrigir, e uma tarefa de autoteste pra ele praticar sozinho nos próximos dias (nunca uma meta de tempo/prazo de venda — só prática de técnica específica).`;
    const text=await clFetchAI(system,prompt,3500);
    if(!text)throw new Error('Resposta vazia da IA');
    const fenceM=text.match(/```chatter\s*([\s\S]*?)```/i);
    let rawGestora=text.trim(),rawChatter='';
    if(fenceM){
      rawChatter=fenceM[1].trim();
      rawGestora=text.slice(0,fenceM.index).trim();
    }else{
      rawChatter=rawGestora;
    }

    // Mostra na hora só a versão casual (a versão de gestão fica só pra ela
    // ver na Ficha) — e manda a fila pro app principal aplicar sozinho.
    el.innerHTML=`<div style="font-size:11px;color:var(--text3);margin-bottom:8px">${weekKeyToLabel(wk)} · ${analises.length} análise${analises.length>1?'s':''} · gerado por você</div>
      <div class="cl-md">${clMd(rawChatter)}</div>
      <button class="btn btn-ghost" style="margin-top:10px" onclick="gerarMeuRelatorioSemanal()">🔄 Gerar de novo (atualiza com análises novas)</button>`;
    toast('✅ Relatório gerado — sua gestora também recebe automaticamente.');

    await fbDb.collection('gestorpro').add({
      type:'chatlabRelatorioPendente',
      processado:false,
      chatterId,chatterNome,
      weekKey:wk,
      date:new Date().toISOString(),
      rawGestora,rawChatter,metrics,
      analisesCount:analises.length,
      criadoEm:firebase.firestore.FieldValue.serverTimestamp()
    });
  }catch(err){
    if(err.quota){
      el.innerHTML=`<div class="error-box">⏳ Limite de uso da IA no momento — espere cerca de ${err.waitSeconds}s e tente de novo.</div>`;
    }else{
      el.innerHTML=`<div class="error-box">❌ ${err.message}</div>`;
    }
  }
};

function renderCopiloto(state,obj){
  const el=document.getElementById('copiloto');
  if(!el)return;
  if(state==='loading'){el.innerHTML='<div class="card" style="border-left:3px solid var(--accent)"><div style="font-size:12.5px;color:var(--text2)">🎯 Copiloto tático calculando…</div></div>';return;}
  if(state==='error'){
    if(obj?.quota){el.innerHTML=`<div class="card" style="border-color:var(--warn)"><div style="color:var(--warn);font-size:12.5px">⏳ Copiloto tático — limite de uso da IA, tente de novo em ${obj.waitSeconds||60}s</div></div>`;return;}
    el.innerHTML=`<div class="card" style="border-color:var(--bad)"><div style="color:var(--bad);font-size:12.5px">❌ Copiloto tático: ${obj?.message||'erro'}</div></div>`;return;
  }
  const t=obj.temperatura||{},a=obj.arquetipo||{},g=obj.gatilhoRecomendado||{};
  const tCol=t.nivel>=9?'var(--ok)':t.nivel>=7?'var(--warn)':'var(--text3)';
  el.innerHTML=`<div class="card" style="border-left:3px solid var(--accent)">
    <div style="font-size:11px;font-weight:700;color:var(--accent);margin-bottom:8px">🎯 COPILOTO TÁTICO — o que fazer agora</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">
      <div style="background:var(--bg-soft);border-radius:8px;padding:8px 12px;text-align:center">
        <div style="font-size:9.5px;color:var(--text3)">TEMPERATURA</div>
        <div style="font-size:16px;font-weight:800;font-family:var(--font-mono);color:${tCol}">${t.nivel||'—'}<span style="font-size:10px"> · ${t.label||''}</span></div>
      </div>
      <div style="background:var(--bg-soft);border-radius:8px;padding:8px 12px;text-align:center">
        <div style="font-size:9.5px;color:var(--text3)">ARQUÉTIPO</div>
        <div style="font-size:13px;font-weight:800">${a.tipo||'—'}<span style="font-size:10px;color:var(--text3)"> (${a.confianca||'—'})</span></div>
      </div>
    </div>
    <div style="font-size:12.5px;margin-bottom:6px"><strong>Tom recomendado:</strong> ${obj.tomRecomendado||'—'}</div>
    <div style="font-size:12.5px;margin-bottom:6px"><strong>Gatilho agora:</strong> ${g.tecnica||'—'}${g.comoAplicar?' — '+g.comoAplicar:''}</div>
    <div style="font-size:13px;font-weight:700;color:var(--ok);margin-bottom:6px">👉 ${obj.proximaAcao||'—'}</div>
    ${obj.alerta?`<div style="font-size:12.5px;color:var(--bad);margin-top:6px">⚠️ ${obj.alerta}</div>`:''}
    ${obj.sinalDeWhale?`<div style="font-size:12.5px;color:var(--accent);margin-top:6px">🐋 ${obj.sinalDeWhale}</div>`:''}
  </div>`;
}

window.rodarAutoanalise=async function(){
  const conv=(document.getElementById('cl-conversa')?.value||'').trim();
  const ctx=(document.getElementById('cl-ctx')?.value||'').trim();
  if(!conv){alert('Cole sua conversa antes de analisar.');return;}
  const btn=document.getElementById('btn-analisar');
  btn.disabled=true;btn.textContent='Analisando…';
  document.getElementById('resultado').innerHTML='<div style="text-align:center;padding:24px;color:var(--text2);font-size:13px">⏳ A IA está analisando sua conversa…</div>';

  // Copiloto tático vem embutido na MESMA chamada da análise completa (ver
  // comentário em CHATLAB_COPILOTO_SCHEMA) — 1 pedido à IA por clique, não 2.
  renderCopiloto('loading');

  const system=`Você é a Gerente Sênior de Performance de uma operação de vendas por chat. Analisa conversas de chatters usando EXATAMENTE o playbook interno da agência abaixo — não critérios genéricos de vendas. Seja crítica, objetiva e didática. Nunca elogie sem evidência. Nunca critique sem ensinar. Toda nota deve ter justificativa baseada na conversa real.\n\n${PLAYBOOK_CATALOGO}`;
  const convLimpa=limparNomesDeRespostaCitada(conv);
  const copilotoInstrucao=`Antes de mais nada, gere um bloco \`\`\`copiloto contendo APENAS um JSON válido (nada de texto fora dele) com exatamente estas chaves, resumindo uma orientação tática rápida pro chatter usar AGORA nessa conversa — se ela for curta demais pra avaliar algo com segurança, escreva "Não foi possível determinar" no campo em vez de inventar:\n${CHATLAB_COPILOTO_SCHEMA}\n\nDepois desse bloco, continue com a análise completa abaixo — são DUAS coisas na mesma resposta, não pule nenhuma das duas.\n\n`;
  const prompt=copilotoInstrucao+`Analise a conversa do chatter **${chatterNome||'chatter'}**.${ctx?'\nContexto: '+ctx:''}\n\nANTES DE ANALISAR: identifique com cuidado qual lado da conversa é você (${chatterNome||'o chatter'}, quem atende/vende) e qual é o lead/cliente (quem compra/consome) — nunca inverta os dois.\n\n---\nCONVERSA:\n${convLimpa}\n---\n\nGere análise em Markdown com: notas X/10 e evidências para Conexão Emocional, Conversão e Timing, Leitura de Sinais de Compra, Condução, Inteligência Emocional, Perfil do Lead, Qualificação, Inteligência Comercial, Criatividade, Gestão do Tempo e Retenção — usando a escala de temperatura, o arquétipo e as técnicas do playbook acima como base de cada avaliação, não critério genérico. Depois:\n\n## 🔴 Maiores Erros (graves → leves, com impacto — classifique cada um usando só o catálogo de erros do playbook)\n## 🟢 O Que Não Deve Mudar\n## 💬 Mensagens Desperdiçadas (reescreva 2-3 usando a técnica/gatilho certo do playbook)\n## 📋 Plano de Treinamento (3 prioridades: objetivo — como treinar — resultado)\n## 📊 Dashboard (tabela indicador × nota)\n**IGP: XX/100** (pesos: Conversão 20%, Conexão 15%, Condução 15%, Sinais 10%, Comercial 10%, demais 5% cada)\n## 🎯 Resumo Executivo\n- Ponto forte / Maior oportunidade / Erro crítico / Foco da semana / Parecer (Promoveria / Manteria com treinamento / Acompanhamento intensivo)\n\nPor fim, numa linha separada ao final, depois de tudo, inclua um bloco \`\`\`json com exatamente: {"temperaturaFinal":0,"arquetipo":"","converteu":"sim|nao|andamento","valor":0,"principalErro":"","sinalDeWhale":false} — baseado só no catálogo acima, pra virar dado estruturado do ranking (não aparece pro chatter, é só pro dashboard).`;

  try{
    let text='',lastErr=null;
    for(let attempt=0;attempt<2;attempt++){
      try{
        // 7000 (não 6000) porque a resposta agora inclui também o bloco
        // ```copiloto embutido, além da análise completa.
        text=await clFetchAI(system,prompt,7000);
      }catch(err){
        lastErr=err;text='';
        if(err.quota)break;
        if(attempt===0)await new Promise(r=>setTimeout(r,1500));
        continue;
      }
      if(text&&/## 🎯 Resumo Executivo/i.test(text))break;
      lastErr=new Error('Resposta incompleta da IA (provavelmente limite de uso no momento — espere um minuto e tente de novo)');
      text='';
      if(attempt===0)await new Promise(r=>setTimeout(r,1500));
    }
    if(!text)throw lastErr||new Error('Resposta vazia da IA');

    // Extrai o bloco ```copiloto ANTES de tudo — o resto (parsing do IGP,
    // tags, renderização) precisa ver só a análise completa.
    const copM=text.match(/```copiloto\s*([\s\S]*?)```/i);
    if(copM){
      try{renderCopiloto('ok',JSON.parse(copM[1]));}
      catch(e){renderCopiloto('error',{message:'Copiloto: resposta em formato inesperado'});}
      text=(text.slice(0,copM.index)+text.slice(copM.index+copM[0].length)).trim();
    }else{
      renderCopiloto('error',{message:'Copiloto não veio nessa resposta'});
    }

    const igpM=text.match(/IGP[^:]*:\s*\**\s*(\d+)/i);
    const igp=igpM?parseInt(igpM[1]):null;
    const resumoM=text.match(/## 🎯 Resumo Executivo([\s\S]*?)(?=\n## |```json|$)/i);
    const resumo=resumoM?resumoM[1].trim().slice(0,600):'';
    let tags=null;
    const jsonM=text.match(/```json\s*([\s\S]*?)```/i);
    if(jsonM){
      try{tags=JSON.parse(jsonM[1]);}catch(e){tags=null;}
      text=text.slice(0,jsonM.index).trim();
    }

    // Salva o registro COMPLETO (com Plano de Treinamento) numa fila que o
    // app principal escuta sozinho (listenToChatlabPendentes em app.js) e
    // aplica automaticamente no ChatLab da gestora — sem precisar importar
    // nada na mão. Mesmo padrão já usado pro link de Avaliação de Chatter.
    await fbDb.collection('gestorpro').add({
      type:'chatlabPendente',
      processado:false,
      chatterId,
      chatterNome,
      date:new Date().toISOString(),
      igp,raw:text,resumo,tags,conv,
      criadoEm:firebase.firestore.FieldValue.serverTimestamp()
    });

    const textoChatter=ocultarPlanoTreinamento(text);
    const col=igp>=70?'var(--ok)':igp>=50?'var(--warn)':'var(--bad)';
    document.getElementById('resultado').innerHTML=`<div class="card" style="border-left:3px solid ${col}">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
        <div style="font-weight:700">Sua análise</div>
        ${igp?`<div style="font-size:22px;font-weight:800;font-family:var(--font-mono);color:${col}">${igp}<span style="font-size:11px;color:var(--text3)">/100</span></div>`:''}
      </div>
      <div class="cl-md">${clMd(textoChatter)}</div>
    </div>`;
    toast('✅ Análise concluída — sua gestora também recebe automaticamente.');
    carregarHistorico();
  }catch(err){
    // Copiloto vem na MESMA resposta agora — se a chamada toda falhou, o
    // card dele não pode ficar preso em "calculando" pra sempre.
    renderCopiloto('error',err);
    if(err.quota){
      document.getElementById('resultado').innerHTML=`<div class="error-box">⏳ Limite de uso da IA no momento — espere cerca de ${err.waitSeconds}s e tente de novo. Sua conversa colada continua no campo.</div>`;
    }else{
      document.getElementById('resultado').innerHTML=`<div class="error-box">❌ ${err.message}</div>`;
    }
  }finally{
    btn.disabled=false;btn.textContent='⚡ Analisar minha conversa';
  }
};

async function carregarHistorico(){
  const el=document.getElementById('historico');
  if(!el||!fbDb)return;
  try{
    const doc=await fbDb.collection('gestorpro').doc('shard-chatlab').get();
    let all=[];
    if(doc.exists&&doc.data().payload){
      const parsed=JSON.parse(doc.data().payload);
      all=parsed.chatlabAnalyses||[];
    }
    const mine=all.filter(a=>a.chatterId===chatterId).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
    if(!mine.length){el.innerHTML='<div style="color:var(--text3);font-size:12.5px">Nenhuma análise ainda — analise sua primeira conversa acima</div>';return;}
    el.innerHTML=mine.slice(0,15).map((a,i)=>{
      const col=a.igp>=70?'var(--ok)':a.igp>=50?'var(--warn)':a.igp?'var(--bad)':'var(--text3)';
      const dt=a.date?new Date(a.date).toLocaleDateString('pt-BR',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}):'';
      return`<div class="hist-item">
        <div class="hist-head" onclick="toggleHist(${i})">
          <div>
            <div style="font-size:11px;color:var(--text3)">${dt}</div>
          </div>
          <div style="display:flex;align-items:center;gap:10px">
            <span style="font-size:18px;font-weight:800;font-family:var(--font-mono);color:${col}">${a.igp||'—'}</span>
            <span style="font-size:10px;color:var(--text3)" id="hist-ic-${i}">▼</span>
          </div>
        </div>
        <div id="hist-body-${i}" class="hist-body"><div class="cl-md">${clMd(ocultarPlanoTreinamento(a.raw||''))}</div></div>
      </div>`;
    }).join('');
    window._histData=mine;
  }catch(e){
    console.error(e);
    el.innerHTML='<div style="color:var(--text3);font-size:12.5px">Não consegui carregar seu histórico agora.</div>';
  }
}
window.toggleHist=function(i){
  const b=document.getElementById('hist-body-'+i),ic=document.getElementById('hist-ic-'+i);
  if(!b)return;
  const open=b.style.display==='block';
  b.style.display=open?'none':'block';
  if(ic)ic.textContent=open?'▼':'▲';
};
</script>
