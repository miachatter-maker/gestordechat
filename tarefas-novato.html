<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Tarefas de Tester — GestorPro</title>
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
:root{
  --bg:#FFFFFF;--bg-soft:#FBF6F7;--line:#F0E2E5;--line-strong:#E5CFD5;
  --text:#241A1D;--text2:#7A6A6E;--text3:#B5A1A6;
  --accent:#E8779B;--accent-soft:#FCEAF0;--accent-strong:#D85C84;
  --ok:#177350;--ok-soft:#E7F5EE;--warn:#9A5B00;--warn-soft:#FBF0DD;
  --bad:#B42334;--bad-soft:#FBEAEA;
  --r-sm:8px;--r-md:10px;--r-lg:14px;
  --font:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{background:var(--bg-soft);}
body{font-family:var(--font);color:var(--text);min-height:100dvh;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;padding:18px 14px 60px;}
.wrap{max-width:620px;margin:0 auto;}
.header{text-align:center;margin-bottom:16px;padding-top:8px;}
.header .eyebrow{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-strong);margin-bottom:4px;}
.header h1{font-size:20px;font-weight:800;}
.header .sub{font-size:12.5px;color:var(--text3);margin-top:4px;}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;margin-bottom:12px;}
.field{margin-bottom:12px;}
.flabel{display:block;font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.03em;margin-bottom:6px;}
.finput,.ftext,.fselect{width:100%;border:1px solid var(--line-strong);border-radius:var(--r-md);padding:10px 12px;font-family:var(--font);font-size:14.5px;color:var(--text);background:#fff;}
.ftext{min-height:60px;resize:vertical;}
.finput:focus,.ftext:focus,.fselect:focus{outline:none;border-color:var(--accent);}
.btn{display:block;width:100%;text-align:center;padding:13px;border-radius:var(--r-md);border:none;font-family:var(--font);font-weight:700;font-size:14.5px;cursor:pointer;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:disabled{opacity:.55;}
.error-box{background:var(--bad-soft);color:var(--bad);border-radius:9px;padding:12px;font-size:13px;margin-bottom:14px;}
.warn-box{background:var(--warn-soft);color:var(--warn);border-radius:9px;padding:12px;font-size:12.5px;margin-bottom:12px;line-height:1.5;}
.done-box{text-align:center;padding:14px 6px;}
.done-box .emoji{font-size:30px;margin-bottom:6px;}
.badge{display:inline-block;padding:4px 9px;border-radius:20px;font-size:10.5px;font-weight:700;}
.badge-enviado{background:var(--ok-soft);color:var(--ok);}
.badge-bloqueado{background:var(--bad-soft);color:var(--bad);}
.badge-aberto{background:var(--accent-soft);color:var(--accent-strong);}
.badge-futuro{background:var(--bg-soft);color:var(--text3);}
.daycard{border:1px solid var(--line);border-radius:var(--r-lg);padding:14px;margin-bottom:12px;}
.daycard.aberto{border-color:var(--accent);}
.daycard-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.daycard-title{font-weight:800;font-size:14.5px;}
.ppm-link{font-size:12px;color:var(--accent-strong);font-weight:700;}
.pastezone{border:2px dashed var(--line-strong);border-radius:var(--r-md);padding:16px 12px;text-align:center;font-size:12px;color:var(--text3);cursor:text;background:#fff;}
.pastezone:focus{outline:none;border-color:var(--accent);background:var(--accent-soft);}
.pastezone.filled{border-color:var(--ok);border-style:solid;}
.pastezone img{max-width:100%;border-radius:8px;margin-top:8px;display:block;}
.or-sep{text-align:center;font-size:11px;color:var(--text3);margin:8px 0;text-transform:uppercase;letter-spacing:.05em;}
.ppm-img{max-width:220px;border-radius:9px;margin-top:8px;display:block;cursor:pointer;border:1px solid var(--line);}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="header">
    <div class="eyebrow">GestorPro · Agência Seduct</div>
    <h1>📋 Tarefas de Tester</h1>
    <div class="sub" id="header-sub">Carregando...</div>
  </div>
  <div id="content"></div>
</div>
<div id="lightbox" onclick="closeLightbox()" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:999;align-items:center;justify-content:center;padding:20px;cursor:zoom-out">
  <img id="lightbox-img" style="max-width:100%;max-height:100%;border-radius:8px">
</div>

<script src="firebase-bundle.js"></script>
<script>
/* ===========================================================
   TAREFAS DE NOVATO — link do TESTER, apenas. Só mostra o
   preenchimento das próprias tarefas de Sexta/Sábado/Domingo — o
   tester NUNCA vê o mapeamento ou as tarefas de outros testers, nem
   quem é padrinho de quem (isso fica só no documento separado dos
   padrinhos, documento-padrinhos.html, com link próprio). Por isso
   essa página busca o mínimo possível: só a lista de nomes dos
   testers (pra montar o seletor) e, depois de escolher o nome, só os
   PRÓPRIOS registros de tarefa dessa pessoa (consulta filtrada por
   testerId, nunca a coleção inteira nem a ficha de outros chatters).
   Ciclo FIXO do calendário: toda Sexta é o Dia 1, todo Sábado o Dia
   2, todo Domingo o Dia 3 — prazo de cada dia é 00h00 do dia
   seguinte (vira bloqueado depois disso, critério de eliminação).
   =========================================================== */

const firebaseConfig={
  apiKey:"AIzaSyA5Q5MYehtJAU18ixZLvqS4-gQnNJJD3LI",
  authDomain:"agenciaseduct-8fd34.firebaseapp.com",
  projectId:"agenciaseduct-8fd34",
  storageBucket:"agenciaseduct-8fd34.firebasestorage.app",
  messagingSenderId:"232929088781",
  appId:"1:232929088781:web:b278bd92bf9bdc857e4c44"
};

const headerSub=document.getElementById('header-sub');
const content=document.getElementById('content');

let fbDb=null;
let chatters=[];
let selTesterId=localStorage.getItem('tn_testerId')||'';
let myRawTarefaDocs=[];
let unsubMyTarefas=null;
// print do PPM: sem Firebase Storage — comprimido no navegador e enviado
// como base64 dentro do próprio documento do Firestore. diaN -> dataURL.
const pendingImages={};

function p2(n){return String(n).padStart(2,'0');}
function fmt(d){return`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;}
function getSextaDoCiclo(ref){
  const d=new Date(ref);
  const dow=d.getDay();
  let diff;
  if(dow===5)diff=0;else if(dow===6)diff=1;else if(dow===0)diff=2;else diff=dow+2;
  return new Date(d.getFullYear(),d.getMonth(),d.getDate()-diff);
}
function getCicloAtual(){
  const now=new Date();
  const sex=getSextaDoCiclo(now);
  const fridayKey=fmt(sex);
  const dias=[1,2,3].map(n=>{
    const dataDia=new Date(sex.getFullYear(),sex.getMonth(),sex.getDate()+(n-1));
    const prazo=new Date(dataDia.getFullYear(),dataDia.getMonth(),dataDia.getDate()+1);
    return{dia:n,dataDia,prazo,label:['Sexta','Sábado','Domingo'][n-1]};
  });
  return{fridayKey,dias};
}
function fmtBR(d){return`${p2(d.getDate())}/${p2(d.getMonth()+1)}`;}

const TAREFAS_DIA={
  1:{campos:[
    {id:'resumo',label:'Resumo sincero',placeholder:'Escreva um feedback sincero com suas palavras sobre o que você entendeu até agora e o que achou do trabalho.'},
    {id:'disponibilidade',label:'Confirmação de disponibilidade',placeholder:'Informe os dias e horários em que você estará disponível para atuar.'}
  ]},
  2:{campos:[
    {id:'resumo',label:'Resumo do que entendeu',placeholder:'Escreva um resumo com suas palavras sobre o que você entendeu até agora.'},
    {id:'cincoNotadas',label:'5 coisas notadas no vídeo de 1 hora',placeholder:'5 coisas que você notou que acontecem no vídeo de 1 hora.'}
  ]},
  3:{campos:[
    {id:'resumo',label:'Resumo das técnicas e habilidades de hoje',placeholder:'Escreva um resumo com suas palavras sobre o que você entendeu das técnicas e habilidades de hoje.'}
  ]}
};

window.openLightbox=function(src){document.getElementById('lightbox-img').src=src;document.getElementById('lightbox').style.display='flex';};
window.closeLightbox=function(){document.getElementById('lightbox').style.display='none';};

function fileToCompressedDataUrl(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        let w=img.width,h=img.height;
        const maxW=900;
        if(w>maxW){h=Math.round(h*maxW/w);w=maxW;}
        const canvas=document.createElement('canvas');
        canvas.width=w;canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg',0.62));
      };
      img.onerror=()=>reject(new Error('Não consegui ler essa imagem.'));
      img.src=reader.result;
    };
    reader.onerror=()=>reject(new Error('Não consegui ler esse arquivo.'));
    reader.readAsDataURL(file);
  });
}
window.handlePastePPM=async function(e,diaN){
  e.preventDefault();
  const items=(e.clipboardData&&e.clipboardData.items)||[];
  let file=null;
  for(const it of items){if(it.kind==='file'&&it.type&&it.type.startsWith('image/')){file=it.getAsFile();break;}}
  if(!file){alert('Não encontrei nenhuma imagem colada — copie o print (Ctrl+C / botão direito → copiar imagem) e cole aqui de novo (Ctrl+V).');return;}
  await setPendingPPM(diaN,file);
};
window.handleFilePPM=async function(e,diaN){
  const file=e.target.files&&e.target.files[0];
  if(!file)return;
  await setPendingPPM(diaN,file);
};
async function setPendingPPM(diaN,file){
  try{
    const dataUrl=await fileToCompressedDataUrl(file);
    pendingImages[diaN]=dataUrl;
    const zone=document.getElementById('pastezone-'+diaN);
    if(zone){
      zone.classList.add('filled');
      zone.innerHTML=`<img src="${dataUrl}"><div style="margin-top:6px;font-weight:700;color:var(--ok)">✅ Print anexado — clique aqui pra trocar</div>`;
    }
  }catch(err){
    console.error(err);
    alert('Não consegui processar essa imagem, tente outra.');
  }
}

/* ---------- init ---------- */
if(typeof firebase==='undefined'){
  headerSub.textContent='Erro de conexão';
  content.innerHTML='<div class="error-box">Não consegui carregar a conexão com o Gestor. Verifique sua internet e recarregue a página.</div>';
}else{
  init();
}
function init(){
  try{
    firebase.apps&&firebase.apps.length?firebase.app():firebase.initializeApp(firebaseConfig);
    fbDb=firebase.firestore();
    headerSub.textContent='Selecione seu nome pra começar';
    content.innerHTML='<div class="warn-box">Carregando...</div>';
    // Só a lista de chatters (nomes) pra montar o seletor — nada de fichas,
    // mapeamento ou dados de outros testers chega até essa página.
    fbDb.collection('gestorpro').doc('central-dados').onSnapshot(doc=>{
      if(!doc.exists)return;
      const remote=doc.data();
      if(remote&&remote.payload){
        try{
          const parsed=JSON.parse(remote.payload);
          chatters=parsed.chatters||[];
          renderAll();
        }catch(e){console.error('Erro ao ler dados',e);}
      }
    },e=>{console.error('Erro central-dados',e);content.innerHTML='<div class="error-box">Erro ao carregar: '+e.message+'</div>';});
  }catch(e){
    console.error(e);
    headerSub.textContent='Erro de conexão';
    content.innerHTML='<div class="error-box">Erro ao conectar: '+e.message+'</div>';
  }
}

function renderAll(){
  const testers=chatters.filter(c=>c.time==='tester');
  headerSub.textContent='Sexta / Sábado / Domingo — ciclo da semana atual';
  if(!testers.length){
    content.innerHTML='<div class="warn-box">Nenhum tester cadastrado ainda — peça pra gestora te criar no Mapeamento dos Novos antes de preencher as tarefas.</div>';
    return;
  }
  if(selTesterId&&!testers.some(t=>t.id===selTesterId))selTesterId='';
  content.innerHTML=`
    <div class="card">
      <div class="field" style="margin-bottom:0">
        <label class="flabel">Selecione seu nome</label>
        <select class="fselect" id="tester-select" onchange="onTesterChange(this.value)">
          <option value="">— selecionar —</option>
          ${testers.map(t=>`<option value="${t.id}" ${selTesterId===t.id?'selected':''}>${t.name}</option>`).join('')}
        </select>
      </div>
    </div>
    <div id="tester-days"></div>
  `;
  if(selTesterId)subscribeMyTarefas(selTesterId);
}
window.onTesterChange=function(id){
  selTesterId=id;
  localStorage.setItem('tn_testerId',id);
  Object.keys(pendingImages).forEach(k=>delete pendingImages[k]);
  subscribeMyTarefas(id);
};
function subscribeMyTarefas(testerId){
  if(unsubMyTarefas){unsubMyTarefas();unsubMyTarefas=null;}
  const el=document.getElementById('tester-days');
  if(!testerId){if(el)el.innerHTML='';return;}
  if(el)el.innerHTML='<div class="warn-box">Carregando suas tarefas...</div>';
  // Consulta filtrada só pelos PRÓPRIOS registros — nunca a coleção inteira.
  unsubMyTarefas=fbDb.collection('gestorpro')
    .where('type','==','tarefaNovatoPendente')
    .where('testerId','==',testerId)
    .onSnapshot(snap=>{
      myRawTarefaDocs=snap.docs.map(d=>d.data());
      renderTesterDays(testerId);
    },e=>{console.error('Erro ao carregar tarefas',e);if(el)el.innerHTML='<div class="error-box">Erro ao carregar suas tarefas: '+e.message+'</div>';});
}
function tsMillis(ts){
  if(!ts)return 0;
  if(typeof ts.toMillis==='function')return ts.toMillis();
  if(ts.seconds)return ts.seconds*1000;
  return 0;
}
function getMinhasTarefas(){
  const base={};
  myRawTarefaDocs.filter(d=>d.fridayKey&&d.dia).forEach(d=>{
    if(!base[d.fridayKey])base[d.fridayKey]={};
    const key='dia'+d.dia;
    const existing=base[d.fridayKey][key];
    const rawTime=tsMillis(d.criadoEm)||Date.now();
    const existingTime=existing&&existing.enviadoEm?new Date(existing.enviadoEm).getTime():0;
    if(!existing||rawTime>=existingTime){
      base[d.fridayKey][key]={resumo:d.resumo||'',disponibilidade:d.disponibilidade||'',cincoNotadas:d.cincoNotadas||'',ppmImage:d.ppmImage||'',enviadoEm:new Date(rawTime).toISOString()};
    }
  });
  return base;
}
function getStatusDia(fridayKey,diaN,dataDia,prazo){
  const tarefas=getMinhasTarefas();
  const reg=tarefas[fridayKey]&&tarefas[fridayKey]['dia'+diaN];
  if(reg&&reg.enviadoEm)return'enviado';
  const agora=new Date();
  if(agora>=prazo)return'bloqueado';
  const inicioDia=new Date(dataDia.getFullYear(),dataDia.getMonth(),dataDia.getDate());
  if(agora>=inicioDia)return'aberto';
  return'futuro';
}
function renderTesterDays(testerId){
  const el=document.getElementById('tester-days');
  if(!el)return;
  const ciclo=getCicloAtual();
  el.innerHTML=ciclo.dias.map(d=>{
    const status=getStatusDia(ciclo.fridayKey,d.dia,d.dataDia,d.prazo);
    const tarefas=getMinhasTarefas();
    const reg=tarefas[ciclo.fridayKey]&&tarefas[ciclo.fridayKey]['dia'+d.dia];
    const badgeLabel={enviado:'✅ Enviado',bloqueado:'❌ Bloqueado',aberto:'🟢 Aberto agora',futuro:'⏳ Ainda não chegou'}[status];
    let bodyHtml='';
    if(status==='enviado'){
      bodyHtml=`<div class="done-box"><div class="emoji">✅</div>Tarefa enviada em ${new Date(reg.enviadoEm).toLocaleString('pt-BR')}.</div>
        ${reg.ppmImage?`<img class="ppm-img" src="${reg.ppmImage}" onclick="openLightbox(this.src)">`:''}`;
    }else if(status==='bloqueado'){
      bodyHtml=`<div class="error-box" style="margin-bottom:0">Indisponível — o prazo desse dia (00h) já passou sem envio. Isso conta como critério de eliminação.</div>`;
    }else if(status==='futuro'){
      bodyHtml=`<div class="warn-box" style="margin-bottom:0">Disponível a partir de ${d.label.toLowerCase()} (${fmtBR(d.dataDia)}).</div>`;
    }else{
      const campos=TAREFAS_DIA[d.dia].campos;
      bodyHtml=`
        ${campos.map(c=>`
          <div class="field">
            <label class="flabel">${c.label}</label>
            <textarea class="ftext" id="campo-${c.id}-${d.dia}" placeholder="${c.placeholder}"></textarea>
          </div>
        `).join('')}
        <div class="field">
          <label class="flabel">Teste de PPM (velocidade de digitação)</label>
          <a class="ppm-link" href="https://10fastfingers.com/typing-test/portuguese" target="_blank" rel="noopener">🔤 Fazer o teste agora (abre em nova aba)</a>
        </div>
        <div class="field">
          <label class="flabel">📎 Print do resultado do PPM (obrigatório)</label>
          <div class="pastezone" id="pastezone-${d.dia}" tabindex="0" onpaste="handlePastePPM(event,${d.dia})">🖱️ Clique aqui e cole (Ctrl+V) o print copiado</div>
          <div class="or-sep">ou</div>
          <input type="file" accept="image/*" id="ppm-file-${d.dia}" class="finput" style="padding:8px" onchange="handleFilePPM(event,${d.dia})">
        </div>
        <button class="btn btn-primary" id="btn-enviar-dia-${d.dia}" onclick="enviarTarefaDia(${d.dia})">📤 Enviar tarefa do dia</button>
      `;
    }
    return`<div class="daycard ${status==='aberto'?'aberto':''}">
      <div class="daycard-head">
        <div class="daycard-title">${d.label} — Dia ${d.dia} <span style="color:var(--text3);font-weight:600">(${fmtBR(d.dataDia)})</span></div>
        <span class="badge badge-${status}">${badgeLabel}</span>
      </div>
      ${bodyHtml}
    </div>`;
  }).join('')+`<div class="warn-box">⚠️ Envie todas as tarefas até às 00h de cada dia — o envio é obrigatório e faz parte dos critérios de eliminação.</div>`;
}
window.enviarTarefaDia=async function(diaN){
  const testerId=selTesterId;
  if(!testerId){alert('Selecione seu nome primeiro.');return;}
  const tester=chatters.find(c=>c.id===testerId);
  if(!tester)return;
  const ciclo=getCicloAtual();
  const diaInfo=ciclo.dias.find(d=>d.dia===diaN);
  const status=getStatusDia(ciclo.fridayKey,diaN,diaInfo.dataDia,diaInfo.prazo);
  if(status!=='aberto'){alert('Esse dia não está mais disponível pra envio.');renderTesterDays(testerId);return;}
  const ppmImage=pendingImages[diaN];
  if(!ppmImage){alert('Anexe (escolha o arquivo ou cole com Ctrl+V) o print do resultado do teste de PPM antes de enviar.');return;}
  const resumo=(document.getElementById('campo-resumo-'+diaN)?.value||'').trim();
  if(!resumo){alert('Escreva o resumo pedido antes de enviar.');return;}
  const btn=document.getElementById('btn-enviar-dia-'+diaN);
  btn.disabled=true;btn.textContent='Enviando...';
  try{
    const payload={
      type:'tarefaNovatoPendente',processado:false,
      testerId,testerNome:tester.name,
      fridayKey:ciclo.fridayKey,dia:diaN,
      resumo,ppmImage,
      criadoEm:firebase.firestore.FieldValue.serverTimestamp()
    };
    if(diaN===1)payload.disponibilidade=(document.getElementById('campo-disponibilidade-1')?.value||'').trim();
    if(diaN===2)payload.cincoNotadas=(document.getElementById('campo-cincoNotadas-2')?.value||'').trim();
    await fbDb.collection('gestorpro').add(payload);
    delete pendingImages[diaN];
  }catch(e){
    console.error(e);
    alert('Erro ao enviar: '+e.message);
    if(btn){btn.disabled=false;btn.textContent='📤 Enviar tarefa do dia';}
  }
};
</script>
</body>
</html>
