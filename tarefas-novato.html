function p2(n){return String(n).padStart(2,'0');}
function fmt(d){return`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;}
function getSextaDoCiclo(ref){
  const d=new Date(ref);
  const dow=d.getDay();
  let diff;
  if(dow===5)diff=0;else if(dow===6)diff=1;else if(dow===0)diff=2;else diff=dow+2;
  return new Date(d.getFullYear(),d.getMonth(),d.getDate()-diff);
}
function getCicloAtual(){
  const now=new Date();
  const sex=getSextaDoCiclo(now);
  const fridayKey=fmt(sex);
  const dias=[1,2,3].map(n=>{
    const dataDia=new Date(sex.getFullYear(),sex.getMonth(),sex.getDate()+(n-1));
    const prazo=new Date(dataDia.getFullYear(),dataDia.getMonth(),dataDia.getDate()+1);
    return{dia:n,dataDia,prazo,label:['Sexta','Sábado','Domingo'][n-1]};
  });
  return{fridayKey,dias};
}
function fmtBR(d){return`${p2(d.getDate())}/${p2(d.getMonth()+1)}`;}

const TAREFAS_DIA={
  1:{campos:[
    {id:'resumo',label:'Resumo sincero',placeholder:'Escreva um feedback sincero com suas palavras sobre o que você entendeu até agora e o que achou do trabalho.'},

// IMPORTANTE (achado em 31/07/2026): o limite de largura (900px) sozinho não
// garantia um tamanho máximo — print de celular é uma imagem ALTA (não só
// larga), então mesmo limitando a largura o print inteiro podia passar de
// 250-300KB dependendo do aparelho/detalhe da tela. Com 15 tarefas guardadas
// por tester (pedido da gestora), isso sozinho quase estourou o limite de
// ~1MB por documento do Firestore (chegou a 977KB, 3 testers pendentes já
// ocupavam 826KB dos 977KB). Agora comprime até caber num orçamento de
// tamanho de verdade — reduz a qualidade e, se ainda não couber, reduz o
// tamanho também — em vez de só limitar a largura e torcer.
const PPM_MAX_BASE64_CHARS=48000; // ~35KB reais — de sobra pra ler um print de resultado de teste de digitação
function fileToCompressedDataUrl(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        let w=img.width,h=img.height;
        const maxW=700;
        if(w>maxW){h=Math.round(h*maxW/w);w=maxW;}
        const canvas=document.createElement('canvas');
        canvas.width=w;canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        let quality=0.6;
        let dataUrl=canvas.toDataURL('image/jpeg',quality);
        let tentativas=0;
        while(dataUrl.length>PPM_MAX_BASE64_CHARS&&quality>0.25&&tentativas<8){
          quality-=0.07;
          dataUrl=canvas.toDataURL('image/jpeg',quality);
          tentativas++;
        }
        if(dataUrl.length>PPM_MAX_BASE64_CHARS){
          // Print muito grande/detalhado mesmo na qualidade mínima — reduz o
          // tamanho físico também (redesenha menor a partir do canvas já
          // reduzido, sem reler o arquivo original).
          const w2=Math.round(w*0.6),h2=Math.round(h*0.6);
          const canvas2=document.createElement('canvas');
          canvas2.width=w2;canvas2.height=h2;
          canvas2.getContext('2d').drawImage(canvas,0,0,w2,h2);
          dataUrl=canvas2.toDataURL('image/jpeg',0.5);
        }
        resolve(dataUrl);
      };
      img.onerror=()=>reject(new Error('Não consegui ler essa imagem.'));
      img.src=reader.result;
    };
    reader.onerror=()=>reject(new Error('Não consegui ler esse arquivo.'));
    reader.readAsDataURL(file);
  });
}
window.handlePastePPM=async function(e,diaN){
  e.preventDefault();
  const items=(e.clipboardData&&e.clipboardData.items)||[];
  let file=null;
  for(const it of items){if(it.kind==='file'&&it.type&&it.type.startsWith('image/')){file=it.getAsFile();break;}}
  if(!file){alert('Não encontrei nenhuma imagem colada — copie o print (Ctrl+C / botão direito → copiar imagem) e cole aqui de novo (Ctrl+V).');return;}
  await setPendingPPM(diaN,file);
};
window.handleFilePPM=async function(e,diaN){
  const file=e.target.files&&e.target.files[0];
  if(!file)return;
  await setPendingPPM(diaN,file);
};
async function setPendingPPM(diaN,file){
  try{
    const dataUrl=await fileToCompressedDataUrl(file);
    pendingImages[diaN]=dataUrl;
    const zone=document.getElementById('pastezone-'+diaN);
    if(zone){
      zone.classList.add('filled');
      zone.innerHTML=`<img src="${dataUrl}"><div style="margin-top:6px;font-weight:700;color:var(--ok)">✅ Print anexado — clique aqui pra trocar</div>`;
    }
  }catch(err){
    console.error(err);
    alert('Não consegui processar essa imagem, tente outra.');
  }
}

/* ---------- init ---------- */
if(typeof firebase==='undefined'){
  headerSub.textContent='Erro de conexão';
  content.innerHTML='<div class="error-box">Não consegui carregar a conexão com o Gestor. Verifique sua internet e recarregue a página.</div>';
}else{
  init();
}
function init(){
  try{
    firebase.apps&&firebase.apps.length?firebase.app():firebase.initializeApp(firebaseConfig);
    fbDb=firebase.firestore();
    headerSub.textContent='Selecione seu nome pra começar';
    content.innerHTML='<div class="warn-box">Carregando...</div>';
    // Só a lista de chatters (nomes) pra montar o seletor — nada de fichas,
    // mapeamento ou dados de outros testers chega até essa página.
    fbDb.collection('gestorpro').doc('central-dados').onSnapshot(doc=>{
      if(!doc.exists)return;
      const remote=doc.data();
      if(remote&&remote.payload){
        try{
          const parsed=JSON.parse(remote.payload);
          chatters=parsed.chatters||[];
          renderAll();
        }catch(e){console.error('Erro ao ler dados',e);}
      }
    },e=>{console.error('Erro central-dados',e);content.innerHTML='<div class="error-box">Erro ao carregar: '+e.message+'</div>';});
  }catch(e){
    console.error(e);
    headerSub.textContent='Erro de conexão';
    content.innerHTML='<div class="error-box">Erro ao conectar: '+e.message+'</div>';
  }
}

function renderAll(){
  // Inclui quem já teve decisão (aprovado/reprovado) também, senão a pessoa
  // some do seletor assim que é aprovada (vira time==='basico') e nunca mais
  // consegue ver a tela de parabéns/dados PJ ou a de reprovação.
  const testers=chatters.filter(c=>c.time==='tester'||c.testerDecision);
  headerSub.textContent='Sexta / Sábado / Domingo — ciclo da semana atual';
  // Se essa pessoa acabou de se autoincluir (pendingAutoNome no localStorage)
  // e agora já apareceu na lista com esse nome, seleciona ela automaticamente
  // — ela não sabe o próprio id, só o nome que digitou.
  const pendingNome=localStorage.getItem('tn_pendingAutoNome');
  if(pendingNome&&!selTesterId){
    const norm=s=>(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
    const match=testers.find(t=>norm(t.name)===norm(pendingNome));
    if(match){
      selTesterId=match.id;
      localStorage.setItem('tn_testerId',match.id);
      localStorage.removeItem('tn_pendingAutoNome');
    }
  }
  if(!testers.length&&!pendingNome){
    // Não é preciso Mapeamento nenhum pra se cadastrar aqui — o mapeamento é
    // uma ferramenta interna que só a gestora/padrinhos usam depois, pra
    // avaliar quem já está no processo. Quem chega aqui e não acha o nome se
    // inclui direto, sem esperar ninguém.
    content.innerHTML=`<div class="warn-box">Nenhum tester cadastrado ainda — use "Não achei meu nome" abaixo pra se incluir direto, sem precisar de ninguém.</div>${autoinclusaoHtml()}`;
    attachAutoinclusaoHandlers();
    return;
  }
  if(selTesterId&&!testers.some(t=>t.id===selTesterId))selTesterId='';
  content.innerHTML=`
    <div class="card">
      <div class="field" style="margin-bottom:0">
        <label class="flabel">Selecione seu nome</label>
        <select class="fselect" id="tester-select" onchange="onTesterChange(this.value)">
          <option value="">— selecionar —</option>
          ${testers.map(t=>`<option value="${t.id}" ${selTesterId===t.id?'selected':''}>${t.name}</option>`).join('')}
        </select>
      </div>
    </div>
    ${pendingNome?'<div class="warn-box">⏳ Só um instante, estamos te cadastrando (isso é automático, não precisa de aprovação de ninguém) — pode levar alguns segundos. Deixe essa página aberta ou volte daqui a pouco pra já começar suas tarefas.</div>':autoinclusaoHtml()}
    <div id="tester-days"></div>
  `;
  attachAutoinclusaoHandlers();
  if(selTesterId)subscribeMyTarefas(selTesterId);
}
function autoinclusaoHtml(){
  return`<div class="card" id="autoinclusao-card">
    <div style="font-size:12.5px;color:var(--text3)">Não achei meu nome na lista?</div>
    <a href="javascript:void(0)" id="autoinclusao-link" style="font-size:13px;font-weight:700;color:var(--accent-strong)">Não achei meu nome →</a>
    <div id="autoinclusao-form" style="display:none;margin-top:10px">
      <div class="field">
        <label class="flabel">Seu nome completo</label>
        <input class="finput" id="autoinclusao-nome" placeholder="Digite seu nome completo">
      </div>
      <button class="btn btn-primary" id="autoinclusao-btn" onclick="enviarAutoinclusao()">Me incluir e continuar</button>
    </div>
  </div>`;
}
function attachAutoinclusaoHandlers(){
  const link=document.getElementById('autoinclusao-link');
  if(link)link.onclick=()=>{
    document.getElementById('autoinclusao-form').style.display='block';
    link.style.display='none';
  };
}
window.enviarAutoinclusao=async function(){
  const nome=(document.getElementById('autoinclusao-nome')?.value||'').trim();
  if(!nome){alert('Digite seu nome completo antes de continuar.');return;}
  const btn=document.getElementById('autoinclusao-btn');
  btn.disabled=true;btn.textContent='Enviando...';
  try{
    await fbDb.collection('gestorpro').add({
      type:'testerAutoInclusaoPendente',processado:false,
      nome,criadoEm:firebase.firestore.FieldValue.serverTimestamp()
    });
    localStorage.setItem('tn_pendingAutoNome',nome);
    renderAll();
  }catch(e){
    console.error(e);
    alert('Erro ao enviar: '+e.message);
    btn.disabled=false;btn.textContent='Me incluir e continuar';
  }
};
window.onTesterChange=function(id){
  selTesterId=id;
  localStorage.setItem('tn_testerId',id);
  Object.keys(pendingImages).forEach(k=>delete pendingImages[k]);
  subscribeMyTarefas(id);
};
function subscribeMyTarefas(testerId){
  if(unsubMyTarefas){unsubMyTarefas();unsubMyTarefas=null;}
  const el=document.getElementById('tester-days');
  if(!testerId){if(el)el.innerHTML='';return;}
  if(el)el.innerHTML='<div class="warn-box">Carregando suas tarefas...</div>';
  // Consulta filtrada só pelos PRÓPRIOS registros — nunca a coleção inteira.
  unsubMyTarefas=fbDb.collection('gestorpro')
    .where('type','==','tarefaNovatoPendente')
    .where('testerId','==',testerId)
    .onSnapshot(snap=>{
      myRawTarefaDocs=snap.docs.map(d=>d.data());
      renderTesterDays(testerId);
    },e=>{console.error('Erro ao carregar tarefas',e);if(el)el.innerHTML='<div class="error-box">Erro ao carregar suas tarefas: '+e.message+'</div>';});
}
function tsMillis(ts){
  if(!ts)return 0;
  if(typeof ts.toMillis==='function')return ts.toMillis();
  if(ts.seconds)return ts.seconds*1000;
  return 0;
}
function getMinhasTarefas(){
  const base={};
  myRawTarefaDocs.filter(d=>d.fridayKey&&d.dia).forEach(d=>{
    if(!base[d.fridayKey])base[d.fridayKey]={};
    const key='dia'+d.dia;
    const existing=base[d.fridayKey][key];
    const rawTime=tsMillis(d.criadoEm)||Date.now();
    const existingTime=existing&&existing.enviadoEm?new Date(existing.enviadoEm).getTime():0;
    if(!existing||rawTime>=existingTime){
      base[d.fridayKey][key]={resumo:d.resumo||'',disponibilidade:d.disponibilidade||'',cincoNotadas:d.cincoNotadas||'',ppmImage:d.ppmImage||'',enviadoEm:new Date(rawTime).toISOString()};
    }
  });
  return base;
}
function getStatusDia(fridayKey,diaN,dataDia,prazo){
  const tarefas=getMinhasTarefas();
  const reg=tarefas[fridayKey]&&tarefas[fridayKey]['dia'+diaN];
  if(reg&&reg.enviadoEm)return'enviado';
  const agora=new Date();
  if(agora>=prazo){
    // Segunda chance aprovada pelo padrinho pra esse dia específico —
    // volta a ficar "aberto" mesmo com o prazo já vencido.
    const tester=chatters.find(t=>t.id===selTesterId);
    const liberado=(tester?.segundaChanceAprovadas||[]).some(s=>s.fridayKey===fridayKey&&s.dia===diaN);
    if(liberado)return'aberto';
    return'bloqueado';
  }
  const inicioDia=new Date(dataDia.getFullYear(),dataDia.getMonth(),dataDia.getDate());
  if(agora>=inicioDia)return'aberto';
  return'futuro';
}
// Cache só desta sessão (a página não lê a ficha do tester, só o array de
// chatters) — depois de pedir segunda chance, lembra que já pediu pra não
// mostrar o botão de novo, até a página recarregar.
const segundaChancePedida=new Set();
function renderTesterDays(testerId){
  const el=document.getElementById('tester-days');
  if(!el)return;
  const tester=chatters.find(t=>t.id===testerId);
  if(tester&&tester.testerDecision==='reprovado'){
    el.innerHTML=`<div class="card" style="text-align:center">
      <div style="font-size:30px;margin-bottom:8px">😊</div>
      <div style="font-size:14.5px">Obrigada pela participação! Seus resultados ainda não foram o suficiente para vaga no momento, mas pode tentar novamente quando quiser 😊</div>
    </div>`;
    return;
  }
  if(tester&&tester.testerDecision==='aprovado'){
    el.innerHTML=`<div class="card">
      <div style="font-size:15px;font-weight:800;margin-bottom:6px">🎉 Parabéns, você foi aprovado!</div>
      <div style="font-size:13px;color:var(--text2);margin-bottom:14px">Agora preencha os dados. (Precisamos de CNPJ para ingressar no teste)</div>
      <div style="font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;margin-bottom:4px">Dados para cada colaborador PJ</div>
      ${['razaoSocial::Razão Social','nickname::Nickname','cnpj::CNPJ','endereco::Endereço de sede','bairro::Bairro','cep::Cep','telefone::Telefone/Celular','email::E-mail','pix::Pix','bancoChave::Banco e chave'].map(p=>{
        const[id,label]=p.split('::');
        return`<div class="field"><label class="flabel">${label}</label><input class="finput" id="pj-${id}"></div>`;
      }).join('')}
      <div style="font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;margin:14px 0 4px">Não obrigatório</div>
      ${['trelloEmail::Email do Trello','telegramNumero::Número do Telegram','telegramNome::Nome no Telegram'].map(p=>{
        const[id,label]=p.split('::');
        return`<div class="field"><label class="flabel">${label}</label><input class="finput" id="pj-${id}"></div>`;
      }).join('')}
      <button class="btn btn-primary" id="btn-enviar-pj" onclick="enviarDadosPJ()">Enviar dados</button>
    </div>`;
    return;
  }
  const ciclo=getCicloAtual();
  el.innerHTML=meusDadosHtml()+ciclo.dias.map(d=>{
    const status=getStatusDia(ciclo.fridayKey,d.dia,d.dataDia,d.prazo);
    const tarefas=getMinhasTarefas();
    const reg=tarefas[ciclo.fridayKey]&&tarefas[ciclo.fridayKey]['dia'+d.dia];
    const badgeLabel={enviado:'✅ Enviado',bloqueado:'❌ Bloqueado',aberto:'🟢 Aberto agora',futuro:'⏳ Ainda não chegou'}[status];
    let bodyHtml='';
    if(status==='enviado'){
      bodyHtml=`<div class="done-box"><div class="emoji">✅</div>Tarefa enviada em ${new Date(reg.enviadoEm).toLocaleString('pt-BR')}.</div>
        ${reg.ppmImage?`<img class="ppm-img" src="${reg.ppmImage}" onclick="openLightbox(this.src)">`:''}`;
    }else if(status==='bloqueado'){
      const chave=ciclo.fridayKey+'_'+d.dia;
      const jaPediu=segundaChancePedida.has(chave);
      bodyHtml=`<div class="error-box">Indisponível — o prazo desse dia (00h) já passou sem envio. Isso conta como critério de eliminação.</div>
        ${jaPediu?'<div class="warn-box" style="margin-bottom:0">🙏 Pedido de segunda chance enviado — aguarde a decisão do padrinho.</div>':`
          <a href="javascript:void(0)" onclick="mostrarFormSegundaChance(${d.dia},'${ciclo.fridayKey}')" style="font-size:13px;font-weight:700;color:var(--accent-strong)">🙏 Solicitar segunda chance</a>
          <div id="sc-form-${d.dia}" style="display:none;margin-top:10px">
            <div class="field">
              <label class="flabel">Justificativa</label>
              <textarea class="ftext" id="sc-justificativa-${d.dia}" placeholder="O que aconteceu?"></textarea>
            </div>
            <button class="btn btn-primary" onclick="enviarSegundaChance(${d.dia},'${ciclo.fridayKey}')">Enviar pedido</button>
          </div>`}`;
    }else if(status==='futuro'){
      bodyHtml=`<div class="warn-box" style="margin-bottom:0">Disponível a partir de ${d.label.toLowerCase()} (${fmtBR(d.dataDia)}).</div>`;
    }else{
      const campos=TAREFAS_DIA[d.dia].campos;
      bodyHtml=`
        ${campos.map(c=>`
          <div class="field">
            <label class="flabel">${c.label}</label>
            <textarea class="ftext" id="campo-${c.id}-${d.dia}" placeholder="${c.placeholder}"></textarea>
          </div>
        `).join('')}
        <div class="field">
          <label class="flabel">Teste de PPM (velocidade de digitação)</label>
          <a class="ppm-link" href="https://10fastfingers.com/typing-test/portuguese" target="_blank" rel="noopener">🔤 Fazer o teste agora (abre em nova aba)</a>
        </div>
        <div class="field">
          <label class="flabel">📎 Print do resultado do PPM (obrigatório)</label>
          <div class="pastezone" id="pastezone-${d.dia}" tabindex="0" onpaste="handlePastePPM(event,${d.dia})">🖱️ Clique aqui e cole (Ctrl+V) o print copiado</div>
          <div class="or-sep">ou</div>
          <input type="file" accept="image/*" id="ppm-file-${d.dia}" class="finput" style="padding:8px" onchange="handleFilePPM(event,${d.dia})">
        </div>
        <button class="btn btn-primary" id="btn-enviar-dia-${d.dia}" onclick="enviarTarefaDia(${d.dia})">📤 Enviar tarefa do dia</button>
      `;
    }
    return`<div class="daycard ${status==='aberto'?'aberto':''}">
      <div class="daycard-head">
        <div class="daycard-title">${d.label} — Dia ${d.dia} <span style="color:var(--text3);font-weight:600">(${fmtBR(d.dataDia)})</span></div>
        <span class="badge badge-${status}">${badgeLabel}</span>
      </div>
      ${bodyHtml}
    </div>`;
  }).join('')+`<div class="warn-box">⚠️ Envie todas as tarefas até às 00h de cada dia — o envio é obrigatório e faz parte dos critérios de eliminação.</div>`;
}
window.mostrarFormSegundaChance=function(diaN,fridayKey){
  const f=document.getElementById('sc-form-'+diaN);
  if(f)f.style.display='block';
};
window.enviarSegundaChance=async function(diaN,fridayKey){
  const texto=(document.getElementById('sc-justificativa-'+diaN)?.value||'').trim();
  if(!texto){alert('Escreva a justificativa antes de enviar.');return;}
  const tester=chatters.find(t=>t.id===selTesterId);
  if(!tester)return;
  try{
    await fbDb.collection('gestorpro').add({
      type:'segundaChancePendente',processado:false,
      testerId:tester.id,testerNome:tester.name,fridayKey,dia:diaN,justificativa:texto,
      criadoEm:firebase.firestore.FieldValue.serverTimestamp()
    });
    segundaChancePedida.add(fridayKey+'_'+diaN);
    renderTesterDays(selTesterId);
  }catch(e){
    console.error(e);
    alert('Erro ao enviar: '+e.message);
  }
};
function meusDadosHtml(){
  return`<div class="card">
    <a href="javascript:void(0)" id="meus-dados-link" onclick="document.getElementById('meus-dados-form').style.display='block';this.style.display='none'" style="font-size:13px;font-weight:700;color:var(--accent-strong)">📋 Preencher meus dados (idade, cidade, experiência, pretensão salarial)</a>
    <div id="meus-dados-msg" style="display:none;font-size:13px;font-weight:600;color:var(--ok,#177350)">✅ Dados enviados, obrigada!</div>
    <div id="meus-dados-form" style="display:none;margin-top:10px">
      <div class="field"><label class="flabel">Idade</label><input class="finput" id="md-idade"></div>
      <div class="field"><label class="flabel">Cidade</label><input class="finput" id="md-cidade"></div>
      <div class="field"><label class="flabel">Experiência</label><textarea class="ftext" id="md-experiencia" placeholder="Sua experiência profissional"></textarea></div>
      <div class="field"><label class="flabel">Pretensão salarial</label><input class="finput" id="md-pretensao"></div>
      <button class="btn btn-primary" id="md-salvar-btn" onclick="enviarMeusDados()">Salvar meus dados</button>
    </div>
  </div>`;
}
window.enviarMeusDados=async function(){
  const tester=chatters.find(t=>t.id===selTesterId);
  if(!tester)return;
  const btn=document.getElementById('md-salvar-btn');
  if(btn){btn.disabled=true;btn.textContent='Enviando...';}
  try{
    await fbDb.collection('gestorpro').add({
      type:'testerDadosPendente',processado:false,
      testerId:tester.id,
      idade:(document.getElementById('md-idade')?.value||'').trim(),
      cidade:(document.getElementById('md-cidade')?.value||'').trim(),
      experiencia:(document.getElementById('md-experiencia')?.value||'').trim(),
      pretensaoSalarial:(document.getElementById('md-pretensao')?.value||'').trim(),
      criadoEm:firebase.firestore.FieldValue.serverTimestamp()
    });
    // Minimiza o form sozinho depois de salvar (a pedido da gestora) — em vez
    // de só alertar e deixar o form aberto, esconde o form e mostra uma
    // confirmação simpática no lugar do link.
    const form=document.getElementById('meus-dados-form');
    const link=document.getElementById('meus-dados-link');
    const msg=document.getElementById('meus-dados-msg');
    if(form)form.style.display='none';
    if(link)link.style.display='none';
    if(msg)msg.style.display='block';
  }catch(e){
    console.error(e);
    alert('Erro ao enviar: '+e.message);
    if(btn){btn.disabled=false;btn.textContent='Salvar meus dados';}
  }
};
window.enviarDadosPJ=async function(){
  const tester=chatters.find(t=>t.id===selTesterId);
  if(!tester)return;
  const val=id=>(document.getElementById('pj-'+id)?.value||'').trim();
  if(!val('cnpj')){alert('O CNPJ é obrigatório pra ingressar no teste.');return;}
  const btn=document.getElementById('btn-enviar-pj');
  btn.disabled=true;btn.textContent='Enviando...';
  try{
    await fbDb.collection('gestorpro').add({
      type:'dadosPjPendente',processado:false,
      testerId:tester.id,
      razaoSocial:val('razaoSocial'),nickname:val('nickname'),cnpj:val('cnpj'),
      endereco:val('endereco'),bairro:val('bairro'),cep:val('cep'),
      telefone:val('telefone'),email:val('email'),pix:val('pix'),bancoChave:val('bancoChave'),
      trelloEmail:val('trelloEmail'),telegramNumero:val('telegramNumero'),telegramNome:val('telegramNome'),
      criadoEm:firebase.firestore.FieldValue.serverTimestamp()
    });
    document.getElementById('tester-days').innerHTML='<div class="card" style="text-align:center"><div class="emoji" style="font-size:30px;margin-bottom:8px">✅</div>Dados enviados! A gestora já pode ver tudo.</div>';
  }catch(e){
    console.error(e);
    alert('Erro ao enviar: '+e.message);
    btn.disabled=false;btn.textContent='Enviar dados';
  }
};
window.enviarTarefaDia=async function(diaN){
  const testerId=selTesterId;
  if(!testerId){alert('Selecione seu nome primeiro.');return;}
  const tester=chatters.find(c=>c.id===testerId);
  if(!tester)return;
  const ciclo=getCicloAtual();
  const diaInfo=ciclo.dias.find(d=>d.dia===diaN);
  const status=getStatusDia(ciclo.fridayKey,diaN,diaInfo.dataDia,diaInfo.prazo);
  if(status!=='aberto'){alert('Esse dia não está mais disponível pra envio.');renderTesterDays(testerId);return;}
  const ppmImage=pendingImages[diaN];
  if(!ppmImage){alert('Anexe (escolha o arquivo ou cole com Ctrl+V) o print do resultado do teste de PPM antes de enviar.');return;}
  const resumo=(document.getElementById('campo-resumo-'+diaN)?.value||'').trim();
  if(!resumo){alert('Escreva o resumo pedido antes de enviar.');return;}
  const btn=document.getElementById('btn-enviar-dia-'+diaN);
  btn.disabled=true;btn.textContent='Enviando...';
  try{
    const payload={
      type:'tarefaNovatoPendente',processado:false,
      testerId,testerNome:tester.name,
      fridayKey:ciclo.fridayKey,dia:diaN,
      resumo,ppmImage,
      criadoEm:firebase.firestore.FieldValue.serverTimestamp()
    };
    if(diaN===1)payload.disponibilidade=(document.getElementById('campo-disponibilidade-1')?.value||'').trim();
    if(diaN===2)payload.cincoNotadas=(document.getElementById('campo-cincoNotadas-2')?.value||'').trim();
    await fbDb.collection('gestorpro').add(payload);
    delete pendingImages[diaN];
  }catch(e){
    console.error(e);
    alert('Erro ao enviar: '+e.message);
    if(btn){btn.disabled=false;btn.textContent='📤 Enviar tarefa do dia';}
  }
};
</script>
</body>
