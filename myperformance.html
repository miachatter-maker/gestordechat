<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Minha Evolução — GestorPro</title>
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
:root{
  --bg:#FFFFFF;--bg-soft:#FBF6F7;--line:#F0E2E5;--line-strong:#E5CFD5;
  --text:#241A1D;--text2:#7A6A6E;--text3:#B5A1A6;
  --accent:#E8779B;--accent-soft:#FCEAF0;--accent-strong:#D85C84;
  --ok:#177350;--ok-soft:#E7F5EE;--warn:#9A5B00;--warn-soft:#FBF0DD;
  --bad:#B42334;--bad-soft:#FBEAEA;--info:#2D6FAE;
  --r-sm:8px;--r-md:10px;--r-lg:14px;
  --font:'Inter',system-ui,sans-serif;
  --font-mono:'Inter',system-ui,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{background:var(--bg-soft);}
body{font-family:var(--font);color:var(--text);min-height:100dvh;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;padding:18px 14px 60px;}
.wrap{max-width:620px;margin:0 auto;}
.header{text-align:center;margin-bottom:20px;padding-top:8px;}
.header .eyebrow{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-strong);margin-bottom:4px;}
.header h1{font-size:21px;font-weight:800;}
.header .sub{font-size:12.5px;color:var(--text3);margin-top:4px;}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;margin-bottom:12px;}
.error-box{background:var(--bad-soft);color:var(--bad);border-radius:9px;padding:12px;font-size:13px;margin-bottom:14px;}
.week-card{background:#fff;border:1px solid var(--line);border-radius:var(--r-md);margin-bottom:10px;overflow:hidden;}
.week-head{padding:12px 14px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;}
.week-body{display:none;padding:0 14px 14px;}
.week-body.open{display:block;}
.dia-row{display:flex;align-items:center;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--line);font-size:12px;}
.dia-row:last-child{border-bottom:none;}
.stat-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:10px;}
.stat-box{background:var(--bg-soft);border-radius:7px;padding:7px;text-align:center;}
.stat-box .lbl{font-size:9px;color:var(--text3);}
.stat-box .val{font-size:13px;font-weight:700;font-family:var(--font-mono);}
.progress-bar{background:var(--line);border-radius:4px;height:5px;overflow:hidden;}
.progress-fill{height:5px;border-radius:4px;}
.name-btn{display:block;width:100%;text-align:left;padding:13px 14px;border:1px solid var(--line);border-radius:var(--r-md);background:#fff;font-family:var(--font);font-size:14.5px;font-weight:600;color:var(--text);cursor:pointer;margin-bottom:8px;}
.name-btn:active{background:var(--accent-soft);}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="header">
    <div class="eyebrow">GestorPro</div>
    <h1>📱 Minha Evolução</h1>
    <div class="sub" id="header-sub">Carregando...</div>
  </div>
  <div id="content"></div>
</div>

<script src="firebase-bundle.js"></script>
<script>
// Página pública pro chatter acompanhar a própria evolução semana a semana.
// Só lê a fatia SEGURA e SEPARADA "shard-weekly-summaries" (ver comentário
// em SHARD_FIELDS/chatterWeeklySummaries no app.js) — nunca a fatia
// "shard-fichas", que guarda Dados PJ sensíveis (CNPJ, pix, endereço) e
// nunca pode chegar num link público.
function money(n){return'R$ '+(Number(n)||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});}
function dayName(dk){
  const d=new Date(dk+'T00:00:00');
  return d.toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'2-digit'}).replace('.','');
}
function weekKeyToLabel(wk){
  const[y,m,d]=wk.split('-').map(Number);
  const mon=new Date(y,m-1,d);
  const sun=new Date(mon);sun.setDate(mon.getDate()+6);
  return`${mon.getDate()}/${mon.getMonth()+1} – ${sun.getDate()}/${sun.getMonth()+1}`;
}
const PAG_MEDAL_LABEL={0:'Sem medalha',1:'🥉 Bronze',2:'🥈 Prata',3:'🥇 Ouro',4:'💎 Diamante'};

const params=new URLSearchParams(location.search);
let chatterId=params.get('id')||localStorage.getItem('mp_chatterId')||'';
let chatterNome=params.get('nome')||localStorage.getItem('mp_chatterNome')||'';
if(params.get('id')){
  localStorage.setItem('mp_chatterId',params.get('id'));
  if(params.get('nome'))localStorage.setItem('mp_chatterNome',params.get('nome'));
}

const headerSub=document.getElementById('header-sub');
const content=document.getElementById('content');
let fbDb=null;
let chattersList=[];

if(!chatterId){
  headerSub.textContent='Selecione seu nome';
  init(true);
}else{
  headerSub.textContent=(chatterNome||'você')+' · acompanhe sua evolução semana a semana';
  init(false);
}

function init(needsSelector){
  try{
    const firebaseConfig={
      apiKey:"AIzaSyA5Q5MYehtJAU18ixZLvqS4-gQnNJJD3LI",
      authDomain:"agenciaseduct-8fd34.firebaseapp.com",
      projectId:"agenciaseduct-8fd34",
      storageBucket:"agenciaseduct-8fd34.firebasestorage.app",
      messagingSenderId:"232929088781",
      appId:"1:232929088781:web:b278bd92bf9bdc857e4c44"
    };
    if(typeof firebase==='undefined'){
      content.innerHTML='<div class="error-box">Não consegui carregar a conexão com o Gestor. Verifique sua internet e recarregue a página.</div>';
      return;
    }
    firebase.apps&&firebase.apps.length?firebase.app():firebase.initializeApp(firebaseConfig);
    fbDb=firebase.firestore();
    if(needsSelector){
      carregarListaChatters();
    }else{
      carregarMinhaEvolucao();
    }
  }catch(e){
    console.error(e);
    content.innerHTML='<div class="error-box">Erro ao conectar: '+e.message+'</div>';
  }
}

// Só pra montar o seletor de nome (quando abre o link sem ?id=) — lê a
// central-dados, mas usa só o campo "chatters" (nome/id/level/time), nunca
// as fichas.
async function carregarListaChatters(){
  content.innerHTML='<div style="text-align:center;padding:30px;color:var(--text2);font-size:13px">Carregando...</div>';
  try{
    const doc=await fbDb.collection('gestorpro').doc('central-dados').get();
    if(!doc.exists||!doc.data().payload){
      content.innerHTML='<div class="error-box">Não encontrei a lista de chatters. Peça o link certo pra sua gestora (com seu nome já incluso).</div>';
      return;
    }
    const parsed=JSON.parse(doc.data().payload);
    chattersList=(parsed.chatters||[]).filter(c=>c.time!=='tester'&&c.time!=='elite');
    if(!chattersList.length){
      content.innerHTML='<div class="error-box">Nenhum chatter encontrado.</div>';
      return;
    }
    content.innerHTML=`<div class="card"><div style="font-size:12.5px;color:var(--text2);margin-bottom:10px">Escolha seu nome:</div>${chattersList.map(c=>`<button class="name-btn" onclick="escolherChatter('${c.id}','${(c.name||'').replace(/'/g,"\\'")}')">${c.name}</button>`).join('')}</div>`;
  }catch(e){
    console.error(e);
    content.innerHTML='<div class="error-box">Não consegui carregar. Recarregue a página.</div>';
  }
}
window.escolherChatter=function(id,nome){
  chatterId=id;chatterNome=nome;
  localStorage.setItem('mp_chatterId',id);
  localStorage.setItem('mp_chatterNome',nome);
  headerSub.textContent=(nome||'você')+' · acompanhe sua evolução semana a semana';
  carregarMinhaEvolucao();
};
window.trocarChatter=function(){
  localStorage.removeItem('mp_chatterId');
  localStorage.removeItem('mp_chatterNome');
  chatterId='';chatterNome='';
  headerSub.textContent='Selecione seu nome';
  carregarListaChatters();
};

async function carregarMinhaEvolucao(){
  content.innerHTML='<div style="text-align:center;padding:30px;color:var(--text2);font-size:13px">Carregando sua evolução...</div>';
  try{
    const doc=await fbDb.collection('gestorpro').doc('shard-weekly-summaries').get();
    let mine=null;
    if(doc.exists&&doc.data().payload){
      const parsed=JSON.parse(doc.data().payload);
      mine=(parsed.chatterWeeklySummaries&&parsed.chatterWeeklySummaries[chatterId])||null;
    }
    if(!mine){
      content.innerHTML=`<div class="card">Ainda não tem dados de evolução processados pra você. Assim que a sua gestora processar o relatório da semana, aparece aqui.</div>
        <div style="text-align:center;margin-top:10px"><a onclick="trocarChatter()" style="font-size:12px;color:var(--text3);cursor:pointer;text-decoration:underline">Não é você? trocar</a></div>`;
      return;
    }
    renderEvolucao(mine);
  }catch(e){
    console.error(e);
    content.innerHTML='<div class="error-box">Não consegui carregar seus dados agora. Recarregue a página.</div>';
  }
}

function renderEvolucao(mine){
  const cm=mine.currentMonth;
  let monthHtml='';
  if(cm){
    monthHtml=`<div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
        <div style="font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase">📆 Meta mensal</div>
        <div style="font-size:12px;color:var(--text2)">${PAG_MEDAL_LABEL[cm.medal]||''}</div>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px">
        <span style="font-family:var(--font-mono);font-weight:800;font-size:18px">${money(cm.monthRevenue)}</span>
        <span style="font-size:11.5px;color:var(--text3)">de ${money(cm.metaMensal)} (${cm.pctMes}%)</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" style="background:${cm.pctMes>=100?'var(--ok)':'var(--accent)'};width:${Math.min(100,cm.pctMes)}%"></div></div>
      ${cm.medalPendente?`<div style="margin-top:10px;background:var(--accent-soft);border-radius:8px;padding:10px 12px;font-size:12.5px">🎉 ${PAG_MEDAL_LABEL[cm.medalPendente.medal]||''} — você tem direito a uma nova medalha essa semana! Fale com sua gestora.</div>`:''}
    </div>`;
    // Financeiro oficial (pedido 04/08/2026) — mesmo resumo que a gestora vê
    // em Evolução, só que sem NENHUM dado pessoal/PJ (nome completo, CNPJ,
    // endereço, telefone, e-mail, PIX ficam de fora — só os números de
    // desempenho, que já eram o que essa pessoa preencheu/gerou).
    const fin=cm.financeiroOficial;
    if(fin){
      const MESES=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
      const [fy,fm]=(fin.monthKey||'').split('-').map(Number);
      const monthLabel=fy&&fm?MESES[fm-1]+'/'+fy:'';
      monthHtml+=`<div class="card" style="border:1px solid var(--accent)">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
          <div style="font-size:11px;font-weight:700;color:var(--accent-strong);text-transform:uppercase">📁 Financeiro oficial — ${monthLabel}</div>
          ${fin.categoriaAtual?`<div style="font-size:11px;color:var(--text2);font-weight:700">Categoria ${fin.categoriaAtual}</div>`:''}
        </div>
        <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px">
          <span style="font-family:var(--font-mono);font-weight:800;font-size:18px">${money(fin.totalGeral)}</span>
          <span style="font-size:11.5px;color:var(--text3)">de ${money(fin.meta)} (${Math.round((fin.pctMeta||0)*100)}%)</span>
        </div>
        <div class="progress-bar"><div class="progress-fill" style="background:${fin.atingiuMeta?'var(--ok)':'var(--accent)'};width:${Math.min(100,Math.round((fin.pctMeta||0)*100))}%"></div></div>
        <div style="display:flex;justify-content:space-between;margin-top:10px;font-size:11.5px;color:var(--text2)">
          <span>⏱️ ${Math.round((fin.horasTotais||0)*10)/10}h no mês</span>
          <span>💎 ${fin.htCount||0} high tickets</span>
        </div>
        ${(fin.porSemana||[]).length?`<div style="margin-top:8px;border-top:1px solid var(--line);padding-top:6px">
          ${fin.porSemana.map(s=>`<div style="display:flex;justify-content:space-between;font-size:11px;padding:2px 0">
            <span style="color:var(--text2)">${s.semana}</span>
            <span style="font-family:var(--font-mono);color:var(--text2)">${money(s.faturamento)}</span>
            <span style="font-weight:700;color:${s.nivel&&s.nivel!=='não bateu'?'var(--ok)':'var(--text3)'}">${s.nivel||'—'}${s.premio?' · '+money(s.premio):''}</span>
          </div>`).join('')}
        </div>`:''}
      </div>`;
    }
  }
  const weekKeys=Object.keys(mine).filter(k=>k!=='currentMonth').sort().reverse();
  let weeksHtml='';
  if(!weekKeys.length){
    weeksHtml='<div class="card">Ainda não tem semanas processadas.</div>';
  }else{
    weeksHtml=weekKeys.map((wk,i)=>{
      const w=mine[wk];
      const diaRows=(w.dayByDay||[]).map(d=>`<div class="dia-row">
        <span style="font-weight:600">${dayName(d.dk)}</span>
        <div style="display:flex;gap:10px;color:var(--text2);font-family:var(--font-mono);font-size:11.5px">
          <span>${money(d.rev)}</span>
          <span style="font-family:var(--font);color:var(--info)">${d.vendas||0}v</span>
          <span style="font-family:var(--font)">${d.htPct||0}%HT</span>
        </div>
      </div>`).join('');
      const bateu=w.meta>0&&w.revenue>=w.meta;
      return`<div class="week-card">
        <div class="week-head" onclick="toggleWeek(${i})">
          <div>
            <div style="font-weight:700;font-size:13.5px">${weekKeyToLabel(wk)} ${bateu?'✅':''}</div>
            <div style="font-size:11px;color:var(--text3)">${PAG_MEDAL_LABEL[w.medal]||''}</div>
          </div>
          <div style="text-align:right">
            <div style="font-family:var(--font-mono);font-weight:800;font-size:15px;color:var(--ok)">${money(w.revenue)}</div>
            <div style="font-size:10.5px;color:var(--text3)">${w.pct!=null?w.pct+'% da meta':''}</div>
          </div>
        </div>
        <div class="week-body" id="wkbody-${i}">
          ${diaRows}
          <div class="stat-grid">
            <div class="stat-box"><div class="lbl">Ticket médio</div><div class="val">${money(w.avgTicket)}</div></div>
            <div class="stat-box"><div class="lbl">Valor/hora</div><div class="val">${money(w.avgVph)}/h</div></div>
            <div class="stat-box"><div class="lbl">High ticket</div><div class="val">${w.avgHigh||0}%</div></div>
            <div class="stat-box"><div class="lbl">Vendas</div><div class="val">${w.totalVendas||0}</div></div>
            <div class="stat-box" style="grid-column:2/4"><div class="lbl">🔥 Melhor horário</div><div class="val" style="color:var(--accent)">${w.peakHour||'—'}</div></div>
          </div>
        </div>
      </div>`;
    }).join('');
  }
  content.innerHTML=`${monthHtml}${weeksHtml}<div style="text-align:center;margin-top:14px"><a onclick="trocarChatter()" style="font-size:12px;color:var(--text3);cursor:pointer;text-decoration:underline">Não é você? trocar</a></div>`;
}
window.toggleWeek=function(i){
  const el=document.getElementById('wkbody-'+i);
  if(el)el.classList.toggle('open');
};
</script>
</body>
</html>
